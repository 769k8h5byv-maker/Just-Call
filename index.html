<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Family Connect</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #fff5f7;
  color: #333;
}


/* =========================
   APP
========================= */

.app {
  width: 100%;
  max-width: 600px;

  min-height: 100vh;

  margin: 0 auto;

  padding: 12px 16px 25px;
}


/* =========================
   SETTINGS
========================= */

.top-bar {
  height: 55px;

  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.settings-button {
  width: 48px;
  height: 48px;

  border: 0;
  border-radius: 50%;

  background: white;

  font-size: 25px;

  box-shadow:
    0 3px 10px rgba(0,0,0,0.10);

  cursor: pointer;
}


/* =========================
   CONTACTS
========================= */

.contacts {
  display: flex;

  flex-direction: column;

  gap: 14px;

  margin-top: 5px;
}


/* =========================
   CONTACT CARD
========================= */

.contact-card {
  background: white;

  border-radius: 22px;

  padding: 18px;

  border: 1px solid #f0dfe3;

  box-shadow:
    0 4px 12px rgba(180,90,110,0.08);
}

.contact-name {
  margin: 0 0 14px;

  text-align: center;

  font-size: 25px;

  font-weight: 750;

  color: #404047;
}


/* =========================
   BUTTONS
========================= */

.contact-actions {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 12px;
}

.call-button,
.text-button {
  min-height: 60px;

  border-radius: 16px;

  display: flex;

  align-items: center;
  justify-content: center;

  text-decoration: none;

  font-size: 19px;

  font-weight: 750;

  color: white;
}

.call-button {
  background: #68c98b;
}

.text-button {
  background: #78a9e6;
}


/* =========================
   EMPTY
========================= */

.empty-message {
  background: white;

  border-radius: 22px;

  padding: 25px 18px;

  text-align: center;

  color: #999;

  font-size: 17px;

  border: 1px solid #f0dfe3;
}


/* =========================
   HELP
========================= */

.help-area {
  margin-top: 24px;

  width: 100%;
}

.help-button {
  display: block;

  width: 100%;

  min-height: 92px;

  border: none;

  border-radius: 24px;

  background: #ed6871;

  color: white;

  font-size: 31px;

  font-weight: 850;

  box-shadow:
    0 6px 15px rgba(220,80,90,0.28);

  cursor: pointer;
}

.help-button:active {
  transform: scale(0.97);
}


/* =========================
   HELP MESSAGE
========================= */

.help-message {
  display: none;

  margin-top: 12px;

  padding: 18px;

  background: white;

  border-radius: 18px;

  text-align: center;

  font-size: 17px;

  line-height: 1.5;

  border: 1px solid #f0dfe3;
}

.help-message.show {
  display: block;
}

.help-message strong {
  color: #df555e;
}


/* =========================
   SETTINGS OVERLAY
========================= */

.settings-overlay {
  display: none;

  position: fixed;

  inset: 0;

  z-index: 999;

  background: rgba(50,40,45,0.50);

  padding: 16px;

  align-items: center;

  justify-content: center;
}

.settings-overlay.show {
  display: flex;
}


/* =========================
   SETTINGS PANEL
========================= */

.settings-panel {
  width: 100%;

  max-width: 500px;

  max-height: 92vh;

  overflow-y: auto;

  background: #fffafa;

  border-radius: 25px;

  padding: 22px;

  box-shadow:
    0 12px 40px rgba(0,0,0,0.22);
}


/* =========================
   HEADER
========================= */

.settings-header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 18px;
}

.settings-title {
  margin: 0;

  font-size: 25px;
}

.close-button {
  width: 44px;
  height: 44px;

  border: none;

  border-radius: 50%;

  background: #eee7e9;

  font-size: 20px;

  cursor: pointer;
}


/* =========================
   NOTICE
========================= */

.family-notice {
  padding: 15px;

  margin-bottom: 18px;

  border-radius: 15px;

  background: #fff0f3;

  color: #744c54;

  font-size: 15px;

  line-height: 1.45;
}


/* =========================
   ADD
========================= */

.add-button {
  width: 100%;

  min-height: 56px;

  border: none;

  border-radius: 15px;

  background: #8b78d8;

  color: white;

  font-size: 18px;

  font-weight: 750;

  cursor: pointer;
}


/* =========================
   MANAGE LIST
========================= */

.manage-list {
  margin-top: 16px;
}

.manage-contact {
  display: flex;

  align-items: center;

  gap: 8px;

  padding: 15px 0;

  border-top: 1px solid #eadfe2;
}

.manage-info {
  flex: 1;
}

.manage-name {
  font-size: 17px;

  font-weight: 700;
}

.manage-phone {
  margin-top: 3px;

  font-size: 14px;

  color: #888;
}

.edit-button,
.delete-button {
  min-height: 42px;

  padding: 8px 11px;

  border: none;

  border-radius: 10px;

  font-size: 14px;

  font-weight: 700;

  cursor: pointer;
}

.edit-button {
  background: #eeeafa;

  color: #6657a3;
}

.delete-button {
  background: #fde4e6;

  color: #b64e57;
}


/* =========================
   FORM
========================= */

.form {
  display: none;

  margin-top: 20px;

  padding-top: 20px;

  border-top: 1px solid #eadfe2;
}

.form.show {
  display: block;
}

.form h3 {
  margin: 0 0 15px;

  font-size: 21px;
}

.form label {
  display: block;

  margin: 13px 0 6px;

  font-size: 15px;

  font-weight: 700;
}

.form input {
  width: 100%;

  height: 52px;

  padding: 0 14px;

  border: 1px solid #d8ced1;

  border-radius: 13px;

  background: white;

  font-size: 17px;

  outline: none;
}


/* =========================
   FORM BUTTONS
========================= */

.form-buttons {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

  margin-top: 18px;
}

.save-button,
.cancel-button {
  min-height: 52px;

  border: none;

  border-radius: 13px;

  font-size: 17px;

  font-weight: 700;

  cursor: pointer;
}

.save-button {
  background: #68c98b;

  color: white;
}

.cancel-button {
  background: #e9e4e5;

  color: #555;
}

</style>

</head>


<body>


<!-- =================================
     MAIN SCREEN
================================= -->

<main class="app">


  <!-- SETTINGS -->

  <div class="top-bar">

    <button
      class="settings-button"
      onclick="openSettings()"
    >
      ⚙️
    </button>

  </div>


  <!-- CONTACTS -->

  <div
    class="contacts"
    id="contactList"
  ></div>


  <!-- HELP -->

  <div class="help-area">

    <button
      class="help-button"
      onclick="toggleHelp()"
    >
      🆘 HELP
    </button>


    <div
      class="help-message"
      id="helpMessage"
    >

      <strong>We're here to help ❤️</strong>

      <br><br>

      Your family can add contacts using
      the ⚙️ button above.

    </div>

  </div>


</main>



<!-- =================================
     FAMILY SETTINGS
================================= -->

<div
  class="settings-overlay"
  id="settingsOverlay"
>

  <div class="settings-panel">


    <div class="settings-header">

      <h2 class="settings-title">
        ⚙️ Family Settings
      </h2>

      <button
        class="close-button"
        onclick="closeSettings()"
      >
        ✕
      </button>

    </div>


    <div class="family-notice">

      ❤️ This area is for family members
      or caregivers.

      <br><br>

      Add the people you want displayed
      on the main screen.

    </div>


    <button
      class="add-button"
      onclick="showAddForm()"
    >
      ＋ Add Contact
    </button>


    <div
      class="manage-list"
      id="manageList"
    ></div>


    <!-- FORM -->

    <div
      class="form"
      id="contactForm"
    >

      <h3 id="formTitle">
        Add Contact
      </h3>


      <label for="nameInput">
        Name
      </label>

      <input
        id="nameInput"
        type="text"
        placeholder="First name"
      >


      <label for="phoneInput">
        Phone Number
      </label>

      <input
        id="phoneInput"
        type="tel"
        placeholder="902-555-1234"
      >


      <div class="form-buttons">

        <button
          class="cancel-button"
          onclick="cancelForm()"
        >
          Cancel
        </button>

        <button
          class="save-button"
          onclick="saveContact()"
        >
          Save ❤️
        </button>

      </div>

    </div>


  </div>

</div>



<script>


/* =========================================
   IMPORTANT
   
   NEW STORAGE KEY
   
   This deliberately does NOT use the old
   storage key, so old contacts such as
   Brian cannot be loaded.
========================================= */

const STORAGE_KEY =
  "familyConnectContacts_v2";


/* =========================================
   START WITH EMPTY CONTACTS
========================================= */

let contacts = [];


/* =========================================
   LOAD ONLY OUR NEW CONTACT LIST
========================================= */

try {

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if (saved) {

    const parsed =
      JSON.parse(saved);

    if (Array.isArray(parsed)) {

      contacts = parsed;

    }

  }

} catch (error) {

  contacts = [];

}


let editingId = null;


/* =========================================
   SAVE
========================================= */

function saveToStorage() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(contacts)
  );

}


/* =========================================
   MAIN CONTACT DISPLAY
========================================= */

function renderContacts() {

  const list =
    document.getElementById(
      "contactList"
    );

  list.innerHTML = "";


  /* EMPTY */

  if (contacts.length === 0) {

    list.innerHTML = `

      <div class="empty-message">

        Your family can add contacts
        using the ⚙️ button above.

      </div>

    `;

    return;
  }


  /* CONTACTS */

  contacts.forEach(function(contact) {

    const card =
      document.createElement("div");

    card.className =
      "contact-card";


    card.innerHTML = `

      <h2 class="contact-name">

        ${escapeHTML(contact.name)}

      </h2>


      <div class="contact-actions">

        <a
          class="call-button"
          href="tel:${phoneNumber(contact.phone)}"
        >
          ☎️ Call
        </a>


        <a
          class="text-button"
          href="sms:${phoneNumber(contact.phone)}"
        >
          💬 Text
        </a>

      </div>

    `;


    list.appendChild(card);

  });

}


/* =========================================
   OPEN SETTINGS
========================================= */

function openSettings() {

  renderManageList();

  document
    .getElementById(
      "settingsOverlay"
    )
    .classList.add("show");

}


/* =========================================
   CLOSE SETTINGS
========================================= */

function closeSettings() {

  cancelForm();

  document
    .getElementById(
      "settingsOverlay"
    )
    .classList.remove("show");

}


/* =========================================
   MANAGEMENT LIST
========================================= */

function renderManageList() {

  const list =
    document.getElementById(
      "manageList"
    );

  list.innerHTML = "";


  if (contacts.length === 0) {

    list.innerHTML = `

      <div class="empty-message">

        No contacts have been added yet.

      </div>

    `;

    return;
  }


  contacts.forEach(function(contact) {

    const row =
      document.createElement("div");

    row.className =
      "manage-contact";


    row.innerHTML = `

      <div class="manage-info">

        <div class="manage-name">

          ${escapeHTML(contact.name)}

        </div>

        <div class="manage-phone">

          ${escapeHTML(contact.phone)}

        </div>

      </div>


      <button
        class="edit-button"
        onclick="editContact(${contact.id})"
      >
        ✏️ Edit
      </button>


      <button
        class="delete-button"
        onclick="deleteContact(${contact.id})"
      >
        🗑️ Delete
      </button>

    `;


    list.appendChild(row);

  });

}


/* =========================================
   ADD FORM
========================================= */

function showAddForm() {

  editingId = null;


  document
    .getElementById("formTitle")
    .textContent =
    "Add Contact";


  document
    .getElementById("nameInput")
    .value = "";


  document
    .getElementById("phoneInput")
    .value = "";


  document
    .getElementById("contactForm")
    .classList.add("show");


  document
    .getElementById("nameInput")
    .focus();

}


/* =========================================
   EDIT
========================================= */

function editContact(id) {

  const contact =
    contacts.find(function(item) {

      return item.id === id;

    });


  if (!contact) return;


  editingId = id;


  document
    .getElementById("formTitle")
    .textContent =
    "Edit Contact";


  document
    .getElementById("nameInput")
    .value =
    contact.name;


  document
    .getElementById("phoneInput")
    .value =
    contact.phone;


  document
    .getElementById("contactForm")
    .classList.add("show");

}


/* =========================================
   SAVE CONTACT
========================================= */

function saveContact() {

  const name =
    document
      .getElementById("nameInput")
      .value
      .trim();


  const phone =
    document
      .getElementById("phoneInput")
      .value
      .trim();


  if (!name) {

    alert(
      "Please enter a name."
    );

    return;
  }


  if (!phone) {

    alert(
      "Please enter a phone number."
    );

    return;
  }


  /* NEW CONTACT */

  if (editingId === null) {

    contacts.push({

      id: Date.now(),

      name: name,

      phone: phone

    });

  }


  /* EDIT CONTACT */

  else {

    const contact =
      contacts.find(function(item) {

        return item.id === editingId;

      });


    if (contact) {

      contact.name = name;

      contact.phone = phone;

    }

  }


  saveToStorage();

  renderContacts();

  renderManageList();

  cancelForm();

}


/* =========================================
   DELETE
========================================= */

function deleteContact(id) {

  const contact =
    contacts.find(function(item) {

      return item.id === id;

    });


  if (!contact) return;


  const confirmed =
    confirm(
      "Delete " +
      contact.name +
      "?"
    );


  if (!confirmed) return;


  contacts =
    contacts.filter(function(item) {

      return item.id !== id;

    });


  saveToStorage();

  renderContacts();

  renderManageList();

}


/* =========================================
   CANCEL FORM
========================================= */

function cancelForm() {

  editingId = null;


  document
    .getElementById("contactForm")
    .classList.remove("show");


  document
    .getElementById("nameInput")
    .value = "";


  document
    .getElementById("phoneInput")
    .value = "";

}


/* =========================================
   HELP
========================================= */

function toggleHelp() {

  document
    .getElementById("helpMessage")
    .classList.toggle("show");

}


/* =========================================
   PHONE
========================================= */

function phoneNumber(phone) {

  return phone.replace(
    /[^0-9+]/g,
    ""
  );

}


/* =========================================
   SAFE HTML
========================================= */

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* =========================================
   START
========================================= */

renderContacts();


</script>

</body>

</html>
