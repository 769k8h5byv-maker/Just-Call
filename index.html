<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
  "https://jjxycvkmikagnivxdxdd.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_gFuE_3Y3I6vs-Ib9Je4mkw_FXlD8wjX";


/* =====================================================
   LOCAL STORAGE
===================================================== */

const CONTACT_STORAGE =
  "familyConnectContacts_v4";


let contacts = [];

let editingId = null;

let currentContact = null;

let currentConversation = null;

let messageTimer = null;


/* =====================================================
   LOAD CONTACTS
===================================================== */

try {

  const saved =
    localStorage.getItem(
      CONTACT_STORAGE
    );


  if (saved) {

    contacts =
      JSON.parse(saved);

  }

}
catch (error) {

  contacts = [];

}


/* =====================================================
   SAVE LOCAL CONTACTS
===================================================== */

function saveContactsLocally() {

  localStorage.setItem(
    CONTACT_STORAGE,
    JSON.stringify(contacts)
  );

}


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
  endpoint,
  options = {}
) {

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/" +
      endpoint,
      {

        method:
          options.method ||
          "GET",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Prefer":
            options.prefer ||
            "return=representation"

        },

        body:
          options.body
            ? JSON.stringify(
                options.body
              )
            : undefined

      }
    );


  if (!response.ok) {

    const errorText =
      await response.text();

    throw new Error(
      errorText ||
      "Supabase request failed."
    );

  }


  const text =
    await response.text();


  return text
    ? JSON.parse(text)
    : [];

}


/* =====================================================
   RENDER DASHBOARD
===================================================== */

function renderContacts() {

  const list =
    document.getElementById(
      "contactList"
    );


  list.innerHTML = "";


  if (
    !contacts ||
    contacts.length === 0
  ) {

    list.innerHTML = `

      <div class="empty-message">

        Your family can add contacts
        using the ⚙️ button.

      </div>

    `;

    return;

  }


  contacts.forEach(

      card.className =

      card.innerHTML = `

          <button

            onclick="openThread('${contact.id}')"

            💬 Text
          </button>

        </div>

      `;


      list.appendChild(card);

    }
  );

}

function editContact(id) {

  const contact =

      function(c) {

      }
    );


  if (!contact) return;


  editingId = id;


  document

  document
    .getElementById(

/* =====================================================
   SAVE CONTACT
===================================================== */

async function saveContact() {

  const name =
    document
      .getElementById(
        "nameInput"
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        "phoneInput"
      )
      .value
      .trim();


  if (!name) {

    alert(
      "Please enter a name."
    );

    return;

  }


  if (!phone) {

    alert(
      "Please enter a phone number."
    );

    return;

  }


  /* =================================================
     NEW CONTACT
  ================================================= */

  if (editingId === null) {

    try {

      const result =
        await supabaseRequest(
          "contacts",
          {

            method:
              "POST",

            body: {

              name:
                name,

              phone:
                phone

            }

          }
        );


      if (
        !result ||
        !result[0]
      ) {

        throw new Error(
          "Supabase did not return the new contact."
        );

      }


      const newContact =
        result[0];


      contacts.push({

        id:
          crypto.randomUUID(),

        supabase_id:
          newContact.id,

        name:
          name,

        phone:
          phone

      });


      saveContactsLocally();

      renderContacts();

      renderManageList();

      cancelForm();


      alert(
        name +
        " has been added! ❤️"
      );

    }

    catch (error) {

      console.error(error);


      alert(
        "Couldn't save the contact.\n\n" +
        error.message
      );

    }


    return;

  }


  /* =================================================
     EDIT EXISTING CONTACT
  ================================================= */

  const contact =
    contacts.find(
      function(c) {

        return String(c.id) ===
          String(editingId);

      }
    );


  if (!contact) {

    alert(
      "Contact not found."
    );

    return;

  }


  try {

    if (
      contact.supabase_id
    ) {

      await supabaseRequest(

        "contacts?id=eq." +
        contact.supabase_id,

        {

          method:
            "PATCH",

          body: {

            name:
              name,

            phone:
              phone

          }

        }

      );

    }

    else {

      const result =
        await supabaseRequest(
          "contacts",
          {

            method:
              "POST",

            body: {

              name:
                name,

              phone:
                phone

            }

          }
        );


      contact.supabase_id =
        result[0].id;

    }


    contact.name =
      name;


    contact.phone =
      phone;


    saveContactsLocally();

    renderContacts();

    renderManageList();

    cancelForm();


    alert(
      "Contact updated! ❤️"
    );

  }

  catch (error) {

    console.error(error);


    alert(
      "Couldn't update the contact.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   DELETE CONTACT
===================================================== */

async function deleteContact(id) {

  const contact =
    contacts.find(
      function(c) {

        return String(c.id) ===
          String(id);

      }
    );


  if (!contact) return;


  const confirmed =
    confirm(
      "Delete " +
      contact.name +
      "?"
    );


  if (!confirmed) return;


  try {

    if (
      contact.supabase_id
    ) {

      await supabaseRequest(

        "contacts?id=eq." +
        contact.supabase_id,

        {

          method:
            "DELETE"

        }

      );

    }


    contacts =
      contacts.filter(
        function(c) {

          return String(c.id) !==
            String(id);

        }
      );


    saveContactsLocally();

    renderContacts();

    renderManageList();


    alert(
      contact.name +
      " was deleted."
    );

  }

  catch (error) {

    console.error(error);


    alert(
      "Couldn't delete the contact.\n\n" +
      error.message
    );

  }

}

    contacts.find(
      function(c) {

        return String(c.id) ===
          String(contactId);

      }
    );


  if (!contact) return;


  if (
    !contact.supabase_id
  ) {

    alert(
      "This contact needs to be saved again before texting."
    );

    return;

  }


  currentContact =
    contact;


  document
    .getElementById(
      "threadName"
    )
    .textContent =
    contact.name;


  document
    .getElementById(
      "threadModal"
    )
    .classList
    .add("show");


  document
    .getElementById(
      "messages"
    )
    .innerHTML = `

      <div class="empty-message">

        Loading conversation...

      </div>

    `;


  try {

    await getConversation();

    await loadMessages();

    startMessageRefresh();

  }

  catch (error) {

    console.error(error);


    document
      .getElementById(
        "messages"
      )
      .innerHTML = `

        <div class="empty-message">

          Couldn't load the conversation.

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

  }

}


/* =====================================================
   GET OR CREATE CONVERSATION
===================================================== */

async function getConversation() {

  let result =
    await supabaseRequest(

      "conversations" +
      "?contact_id=eq." +
      currentContact.supabase_id +
      "&select=*"

    );


  if (
    !result ||
    result.length === 0
  ) {

    result =
      await supabaseRequest(
        "conversations",
        {

          method:
            "POST",

          body: {

            contact_id:
              currentContact.supabase_id

          }

        }
      );

  }


  currentConversation =
    result[0];

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages() {

  if (
    !currentConversation
  ) {

    return;

  }


  const result =
    await supabaseRequest(

      "messages" +
      "?conversation_id=eq." +
      currentConversation.id +
      "&select=*" +
      "&order=created_at.asc"

    );


  renderMessages(
    result
  );

}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(
  messages
) {

  const container =
    document.getElementById(
      "messages"
    );


  container.innerHTML = "";


  if (
    !messages ||
    messages.length === 0
  ) {

    container.innerHTML = `

      <div class="empty-message">

        No messages yet.

        <br><br>

        Say hello! ❤️

      </div>

    `;

    return;

  }


  messages.forEach(
    function(message) {

      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "message " +
        (
          message.sender === "me"
            ? "me"
            : "contact"
        );


      const time =
        new Date(
          message.created_at
        )
        .toLocaleTimeString(
          [],
          {
            hour:
              "numeric",

            minute:
              "2-digit"
          }
        );


      bubble.innerHTML = `

        <div>

          ${escapeHTML(
            message.message
          )}

        </div>


        <div class="message-time">

          ${time}

        </div>

      `;


      container.appendChild(
        bubble
      );

    }
  );


  container.scrollTop =
    container.scrollHeight;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if (!text) return;


  if (
    !currentConversation
  ) {

    alert(
      "The conversation isn't ready yet."
    );

    return;

  }


  input.value = "";


  try {

    await supabaseRequest(
      "messages",
      {

        method:
          "POST",

        body: {

          conversation_id:
            currentConversation.id,

          sender:
            "me",

          message:
            text

        }

      }
    );


    await loadMessages();

  }

  catch (error) {

    console.error(error);


    input.value =
      text;


    alert(
      "Couldn't save the message.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   REFRESH THREAD
===================================================== */

function startMessageRefresh() {

  stopMessageRefresh();


  messageTimer =
    setInterval(
      async function() {

        if (
          currentConversation &&
          document
            .getElementById(
              "threadModal"
            )
            .classList
            .contains("show")
        ) {

          try {

            await loadMessages();

          }

          catch (error) {

            console.error(
              error
            );

          }

        }

      },
      3000
    );

}


/* =====================================================
   STOP REFRESH
===================================================== */

function stopMessageRefresh() {

  if (
    messageTimer
  ) {

    clearInterval(
      messageTimer
    );

    messageTimer =
      null;

  }

}


/* =====================================================
   CLOSE THREAD
===================================================== */

function closeThread() {

  stopMessageRefresh();


  currentContact =
    null;


  currentConversation =
    null;


  document
    .getElementById(
      "threadModal"
    )
    .classList
    .remove("show");


  document
    .getElementById(
      "messageInput"
    )
    .value = "";

}


/* =====================================================
   HELP
===================================================== */

function toggleHelp() {

  document
    .getElementById(
      "helpMessage"
    )
    .classList
    .toggle("show");

}


/* =====================================================
   PHONE CLEANUP
===================================================== */

function phoneNumber(
  phone
) {

  return phone.replace(
    /[^0-9+]/g,
    ""
  );

}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* =====================================================
   ENTER KEY SENDS
===================================================== */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =====================================================
   START APP
===================================================== */

renderContacts();

</script>
