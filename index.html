<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>My Contacts</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 30px;
    }

    /* HEADER */

    header {
      background: white;
      padding: 18px 18px 16px;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 25px;
      font-weight: 700;
      margin: 0;
    }

    .help-button {
      border: none;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 14px;
      min-height: 44px;
      cursor: pointer;
    }

    .help-button:active {
      transform: scale(0.96);
    }

    /* CONTACT LIST */

    .contacts {
      padding: 16px;
    }

    .contact {
      background: white;
      border-radius: 18px;
      margin-bottom: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .contact-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .contact-info {
      min-width: 0;
      flex: 1;
    }

    .contact-name {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .contact-number {
      font-size: 14px;
      color: #6b7280;
    }

    /* ACTION BUTTONS */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-button {
      min-height: 50px;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .call-button {
      background: #16a34a;
      color: white;
    }

    .text-button {
      background: #2563eb;
      color: white;
    }

    .action-button:active {
      transform: scale(0.97);
    }

    /* HELP BOX */

    .help-box {
      display: none;
      margin: 0 16px 16px;
      padding: 18px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .help-box h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .help-box p {
      line-height: 1.5;
      color: #4b5563;
    }

    .close-help {
      margin-top: 8px;
      width: 100%;
      min-height: 46px;
      border: none;
      border-radius: 12px;
      background: #e5e7eb;
      font-weight: 700;
      font-size: 16px;
    }

    /* SMALL PHONES */

    @media (max-width: 380px) {
      .title {
        font-size: 22px;
      }

      .contact {
        padding: 14px;
      }

      .action-button {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <header>
      <div class="header-row">

        <h1 class="title">My Contacts</h1>

        <button
          class="help-button"
          type="button"
          onclick="toggleHelp()"
          aria-label="Open help"
        >
          Help
        </button>

      </div>
    </header>


    <!-- HELP -->

    <div class="help-box" id="helpBox">

      <h2>Need Help?</h2>

      <p>
        Choose a contact below and tap <strong>Call</strong> to phone them
        or <strong>Text</strong> to send them a message.
      </p>

      <button
        class="close-help"
        type="button"
        onclick="toggleHelp()"
      >
        Close
      </button>

    </div>


    <!-- CONTACTS -->

    <main class="contacts">

      <!-- CONTACT 1 -->

      <div class="contact">

        <div class="contact-top">

          <div class="avatar">
            B
          </div>

          <div class="contact-info">

            <div class="contact-name">
              Brian
            </div>

            <div class="contact-number">
              902-555-0101
            </div>

          </div>

        </div>

        <div class="actions">

          <a
            class="action-button call-button"
            href="tel:+19025550101"
            aria-label="Call Brian"
          >
            ☎ Call
          </a>

          <a
            class="action-button text-button"
            href="sms:+19025550101"
            aria-label="Text Brian"
          >
            💬 Text
          </a>

        </div>

      </div>


      <!-- CONTACT 2 -->

      <div class="contact">

        <div class="contact-top">

          <div class="avatar">
            L
          </div>

          <div class="contact-info">

            <div class="contact-name">
              Lisa
            </div>

            <div class="contact-number">
              902-555-0102
            </div>

          </div>

        </div>

        <div class="actions">

          <a
            class="action-button call-button"
            href="tel:+19025550102"
            aria-label="Call Lisa"
          >
            ☎ Call
          </a>

          <a
            class="action-button text-button"
            href="sms:+19025550102"
            aria-label="Text Lisa"
          >
            💬 Text
          </a>

        </div>

      </div>


      <!-- CONTACT 3 -->

      <div class="contact">

        <div class="contact-top">

          <div class="avatar">
            M
          </div>

          <div class="contact-info">

            <div class="contact-name">
              Mom
            </div>

            <div class="contact-number">
              902-555-0103
            </div>

          </div>

        </div>

        <div class="actions">

          <a
            class="action-button call-button"
            href="tel:+19025550103"
            aria-label="Call Mom"
          >
            ☎ Call
          </a>

          <a
            class="action-button text-button"
            href="sms:+19025550103"
            aria-label="Text Mom"
          >
            💬 Text
          </a>

        </div>

      </div>

    </main>

  </div>


  <script>

    function toggleHelp() {

      const helpBox = document.getElementById("helpBox");

      if (helpBox.style.display === "block") {
        helpBox.style.display = "none";
      } else {
        helpBox.style.display = "block";
      }

    }

  </script>

</body>
</html>
