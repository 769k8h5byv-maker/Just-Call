<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just Call</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(135deg,#eef4ff,#f8f5ff);
    color:#20252d;
}

.app{
    max-width:650px;
    min-height:100vh;
    margin:auto;
    padding:30px 18px 45px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

h1{
    margin:0;
    font-size:45px;
    letter-spacing:-1.5px;
}

.subtitle{
    margin-top:6px;
    color:#69717d;
    font-size:19px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:14px;
}

.action{
    border:0;
    border-radius:27px;
    min-height:180px;
    color:white;
    cursor:pointer;
    box-shadow:0 15px 35px rgba(0,0,0,.14);
    transition:.18s;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.action:active{transform:scale(.97)}

.call-action{
    background:linear-gradient(145deg,#168b4b,#32ad68);
}

.text-action{
    background:linear-gradient(145deg,#5367df,#7585ef);
}

.help-action{
    width:100%;
    min-height:125px;
    margin-bottom:28px;
    background:linear-gradient(145deg,#df4545,#f06b6b);
}

.action-icon{
    font-size:55px;
    margin-bottom:8px;
}

.action-title{
    font-size:29px;
    font-weight:800;
}

.action-subtitle{
    font-size:15px;
    opacity:.9;
    margin-top:4px;
}

.section-title{
    font-size:21px;
    font-weight:750;
    margin:25px 5px 12px;
}

.contacts{
    display:grid;
    gap:11px;
}

.contact{
    width:100%;
    border:0;
    border-radius:21px;
    background:white;
    padding:17px;
    display:flex;
    align-items:center;
    gap:15px;
    text-align:left;
    cursor:pointer;
    box-shadow:0 7px 25px rgba(48,63,90,.08);
}

.avatar{
    width:62px;
    height:62px;
    flex-shrink:0;
    border-radius:19px;
    background:#edf1f7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
}

.contact-info{flex:1}

.contact-name{
    font-size:22px;
    font-weight:700;
}

.relationship{
    color:#747d88;
    margin-top:3px;
}

.contact-action{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#e8f7ed;
    color:#24934d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

/* VOICE */

.voice-panel,
.confirm-panel,
.thread{
    display:none;
}

.voice-panel.show,
.confirm-panel.show,
.thread.show{
    display:block;
}

.voice-panel,
.confirm-panel{
    background:white;
    border-radius:27px;
    padding:28px 20px;
    text-align:center;
    box-shadow:0 12px 35px rgba(48,63,90,.10);
    margin-bottom:25px;
}

.voice-circle{
    width:135px;
    height:135px;
    border-radius:50%;
    margin:auto;
    background:#20252d;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    animation:pulse 1.3s infinite;
}

.voice-title{
    margin-top:20px;
    font-size:27px;
    font-weight:750;
}

.voice-instruction{
    margin-top:7px;
    color:#727a85;
    font-size:18px;
}

.cancel{
    margin-top:20px;
    border:0;
    padding:12px 25px;
    border-radius:12px;
    background:#eee;
    font-size:16px;
}

@keyframes pulse{
    70%{box-shadow:0 0 0 25px rgba(84,105,225,0)}
}

/* THREAD */

.thread{
    background:white;
    border-radius:27px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(48,63,90,.12);
    margin-bottom:25px;
}

.thread-header{
    padding:18px;
    display:flex;
    align-items:center;
    gap:13px;
    border-bottom:1px solid #eee;
}

.back{
    border:0;
    background:#eef1f6;
    width:44px;
    height:44px;
    border-radius:50%;
    font-size:23px;
    cursor:pointer;
}

.thread-avatar{
    width:50px;
    height:50px;
    border-radius:16px;
    background:#edf1f7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
}

.thread-name{
    font-size:22px;
    font-weight:750;
}

.thread-sub{
    color:#7b838d;
    font-size:14px;
}

.messages{
    min-height:280px;
    max-height:430px;
    overflow-y:auto;
    padding:20px 16px;
    background:#f7f8fb;
}

.message{
    max-width:82%;
    padding:12px 16px;
    border-radius:19px;
    margin-bottom:10px;
    font-size:18px;
    line-height:1.35;
}

.message.you{
    margin-left:auto;
    background:#5367df;
    color:white;
    border-bottom-right-radius:5px;
}

.message.them{
    background:#e4e7ec;
    color:#20252d;
    border-bottom-left-radius:5px;
}

.empty-thread{
    text-align:center;
    color:#8a919b;
    padding:70px 20px;
    font-size:18px;
}

.thread-actions{
    padding:14px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.thread-button{
    border:0;
    border-radius:15px;
    padding:16px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}

.say-button{
    background:#5367df;
    color:white;
}

.type-button{
    background:#eef0f4;
}

.text-entry{
    display:none;
    padding:0 14px 15px;
    gap:8px;
}

.text-entry.show{
    display:flex;
}

.text-entry input{
    flex:1;
    padding:14px;
    border:1px solid #d5d9df;
    border-radius:14px;
    font-size:17px;
}

.send{
    border:0;
    border-radius:14px;
    padding:0 18px;
    background:#24934d;
    color:white;
    font-weight:700;
}

/* MANAGE */

.setup{
    margin-top:30px;
    background:white;
    border-radius:22px;
    padding:20px;
    box-shadow:0 7px 25px rgba(48,63,90,.08);
}

summary{
    cursor:pointer;
    font-weight:700;
    font-size:18px;
}

.person-editor{
    background:#f6f7fa;
    border-radius:18px;
    padding:16px;
    margin-top:12px;
}

input,select{
    width:100%;
    margin-top:6px;
    padding:13px;
    border:1px solid #d9dde4;
    border-radius:11px;
    font-size:16px;
    background:white;
}

label{
    display:block;
    margin-top:12px;
    font-size:14px;
    font-weight:650;
    color:#5d6570;
}

.editor-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
}

.save-person,.delete-person,.add-person{
    border:0;
    border-radius:12px;
    padding:13px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.save-person{
    background:#20252d;
    color:white;
}

.delete-person{
    background:#f2dddd;
    color:#a32d2d;
}

.add-person{
    width:100%;
    margin-top:15px;
    background:#5367df;
    color:white;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,120px);
    background:#20252d;
    color:white;
    padding:15px 21px;
    border-radius:15px;
    font-size:17px;
    transition:.3s;
    z-index:20;
}

.toast.show{
    transform:translate(-50%,0);
}

@media(max-width:450px){
    .app{padding:25px 14px 35px}
    h1{font-size:39px}
    .action{min-height:160px}
    .action-title{font-size:25px}
}
</style>
</head>


<body>

<div class="app">

<div class="header">
    <h1>Just Call</h1>
    <div class="subtitle">What would you like to do?</div>
</div>


<div class="actions">

<button class="action call-action" id="callButton">
    <div class="action-icon">☎️</div>
    <div class="action-title">CALL</div>
    <div class="action-subtitle">Tell me who to call</div>
</button>

<button class="action text-action" id="textButton">
    <div class="action-icon">💬</div>
    <div class="action-title">TEXT</div>
    <div class="action-subtitle">Open a conversation</div>
</button>

</div>


<button class="action help-action" id="helpButton">
    <div class="action-icon">🆘</div>
    <div class="action-title">HELP</div>
    <div class="action-subtitle">Call my help contact</div>
</button>


<!-- VOICE -->

<div class="voice-panel" id="voicePanel">

    <div class="voice-circle">🎙️</div>

    <div class="voice-title" id="voiceTitle">
        I'm listening
    </div>

    <div class="voice-instruction" id="voiceInstruction">
    </div>

    <button class="cancel" id="cancelVoice">
        Cancel
    </button>

</div>


<!-- TEXT CONFIRMATION -->

<div class="confirm-panel" id="confirmPanel">

    <div style="font-size:50px">💬</div>

    <div style="font-size:24px;font-weight:750;margin-top:8px">
        Ready to send
    </div>

    <div id="confirmTo" style="color:#707985;margin-top:5px"></div>

    <div id="messageBox"
         style="margin-top:20px;padding:20px;border-radius:18px;background:#f1f3ff;font-size:20px;text-align:left">
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px">

        <button class="thread-button"
                style="background:#24934d;color:white"
                id="sendText">
            ✓ SEND
        </button>

        <button class="thread-button"
                id="cancelText">
            CANCEL
        </button>

    </div>

</div>


<!-- CONVERSATION -->

<div class="thread" id="thread">

    <div class="thread-header">

        <button class="back" id="closeThread">
            ←
        </button>

        <div class="thread-avatar" id="threadAvatar">
            👤
        </div>

        <div>
            <div class="thread-name" id="threadName"></div>
            <div class="thread-sub" id="threadRelationship"></div>
        </div>

    </div>


    <div class="messages" id="messages"></div>


    <div class="thread-actions">

        <button class="thread-button say-button" id="sayMessage">
            🎙️ SAY A TEXT
        </button>

        <button class="thread-button type-button" id="typeMessage">
            ⌨️ TYPE
        </button>

    </div>


    <div class="text-entry" id="textEntry">

        <input
            id="typedMessage"
            placeholder="Type a message..."
        >

        <button class="send" id="sendTyped">
            SEND
        </button>

    </div>

</div>


<div class="section-title">
    People
</div>

<div class="contacts" id="contacts"></div>


<details class="setup">

<summary>
    ⚙️ Manage people
</summary>

<div id="peopleEditors"></div>

<button class="add-person" id="addPerson">
    + Add a person
</button>

</details>

</div>


<div class="toast" id="toast"></div>


<script>

let people =
JSON.parse(localStorage.getItem("justCallPeople")) || [
    {
        id:crypto.randomUUID(),
        name:"Sarah",
        relationship:"Granddaughter",
        phone:"",
        icon:"👧",
        help:false
    },
    {
        id:crypto.randomUUID(),
        name:"John",
        relationship:"Brother",
        phone:"",
        icon:"👨",
        help:false
    }
];


let conversations =
JSON.parse(localStorage.getItem("justCallConversations")) || {};

let selectedPerson = null;
let recognition = null;
let currentMode = null;


const contacts =
document.getElementById("contacts");

const peopleEditors =
document.getElementById("peopleEditors");

const thread =
document.getElementById("thread");

const messages =
document.getElementById("messages");

const threadName =
document.getElementById("threadName");

const threadRelationship =
document.getElementById("threadRelationship");

const threadAvatar =
document.getElementById("threadAvatar");

const voicePanel =
document.getElementById("voicePanel");

const voiceTitle =
document.getElementById("voiceTitle");

const voiceInstruction =
document.getElementById("voiceInstruction");

const confirmPanel =
document.getElementById("confirmPanel");

const confirmTo =
document.getElementById("confirmTo");

const messageBox =
document.getElementById("messageBox");

const toast =
document.getElementById("toast");


function savePeople(){
    localStorage.setItem(
        "justCallPeople",
        JSON.stringify(people)
    );
}


function saveConversations(){
    localStorage.setItem(
        "justCallConversations",
        JSON.stringify(conversations)
    );
}


function renderContacts(){

    contacts.innerHTML="";

    people.forEach(person=>{

        if(!person.name)return;

        const button=document.createElement("button");

        button.className="contact";

        button.innerHTML=`

            <div class="avatar">
                ${person.icon || "👤"}
            </div>

            <div class="contact-info">

                <div class="contact-name">
                    ${escapeHTML(person.name)}
                </div>

                <div class="relationship">
                    ${escapeHTML(person.relationship || "Contact")}
                </div>

            </div>

            <div class="contact-action">
                💬
            </div>
        `;

        button.onclick=()=>openThread(person);

        contacts.appendChild(button);

    });
}


function openThread(person){

    selectedPerson=person;

    threadName.textContent=person.name;

    threadRelationship.textContent=
        person.relationship || "Contact";

    threadAvatar.textContent=
        person.icon || "👤";

    thread.classList.add("show");

    document.querySelector(".section-title").style.display="none";

    contacts.style.display="none";

    renderMessages();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function closeThread(){

    thread.classList.remove("show");

    contacts.style.display="grid";

    document.querySelector(".section-title").style.display="block";

    selectedPerson=null;

}


document
.getElementById("closeThread")
.onclick=closeThread;


function renderMessages(){

    messages.innerHTML="";

    if(!selectedPerson)return;

    const list=
        conversations[selectedPerson.id] || [];

    if(list.length===0){

        messages.innerHTML=`
            <div class="empty-thread">
                No messages yet.<br><br>
                Tap <b>SAY A TEXT</b> to send one.
            </div>
        `;

        return;
    }


    list.forEach(item=>{

        const bubble=document.createElement("div");

        bubble.className=
            "message " +
            (item.from==="you" ? "you":"them");

        bubble.textContent=item.text;

        messages.appendChild(bubble);

    });

    messages.scrollTop=
        messages.scrollHeight;
}


function addMessage(text){

    if(!selectedPerson)return;

    if(!conversations[selectedPerson.id]){
        conversations[selectedPerson.id]=[];
    }

    conversations[selectedPerson.id].push({

        from:"you",

        text:text,

        time:Date.now()

    });

    saveConversations();

    renderMessages();

}


function callPerson(person){

    if(!person.phone){

        showToast(
            `No phone number saved for ${person.name}.`
        );

        return;
    }

    window.location.href="tel:"+person.phone;
}


document
.getElementById("callButton")
.onclick=()=>{

    startListening("call");

};


document
.getElementById("textButton")
.onclick=()=>{

    startListening("text");

};


document
.getElementById("helpButton")
.onclick=()=>{

    const person=
        people.find(p=>p.help===true);

    if(!person){

        showToast(
            "Set a HELP contact in Manage People."
        );

        return;
    }

    callPerson(person);

};


const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;


function startListening(mode){

    if(!SpeechRecognition){

        showToast(
            "Voice recognition isn't supported here."
        );

        return;
    }

    currentMode=mode;

    voicePanel.classList.add("show");

    if(mode==="call"){

        voiceTitle.textContent=
            "Who would you like to call?";

        voiceInstruction.textContent=
            'Try "Call Sarah."';

    }else{

        voiceTitle.textContent=
            "Who would you like to text?";

        voiceInstruction.textContent=
            'Try "Text Sarah that I am home."';

    }

    recognition=
        new SpeechRecognition();

    recognition.lang="en-CA";

    recognition.interimResults=false;

    recognition.maxAlternatives=3;

    recognition.onresult=event=>{

        const spoken=
            event.results[0][0]
            .transcript
            .trim();

        voicePanel.classList.remove("show");

        if(currentMode==="call"){
            processCall(spoken);
        }else{
            processText(spoken);
        }
    };

    recognition.onerror=()=>{

        voicePanel.classList.remove("show");

        showToast(
            "I didn't catch that. Please try again."
        );
    };

    recognition.start();
}


function findPerson(text){

    const lower=text.toLowerCase();

    for(const person of people){

        if(
            person.name &&
            lower.includes(
                person.name.toLowerCase()
            )
        ){
            return person;
        }
    }

    for(const person of people){

        if(
            person.relationship &&
            lower.includes(
                person.relationship.toLowerCase()
            )
        ){
            return person;
        }
    }

    return null;
}


function processCall(spoken){

    const person=findPerson(spoken);

    if(!person){

        showToast(
            "I don't know who you mean."
        );

        return;
    }

    callPerson(person);
}


function processText(spoken){

    const person=findPerson(spoken);

    if(!person){

        showToast(
            "I don't know who you mean."
        );

        return;
    }

    const message=
        extractMessage(spoken,person);

    if(!message){

        showToast(
            "I couldn't hear the message."
        );

        return;
    }

    confirmTo.textContent=
        "To "+person.name;

    messageBox.textContent=
        message;

    confirmPanel.classList.add("show");

    document
    .getElementById("sendText")
    .dataset.personId=
        person.id;

    document
    .getElementById("sendText")
    .dataset.message=
        message;

}


function extractMessage(spoken,person){

    let message=spoken;

    if(person.name){

        message=
            message.replace(
                new RegExp(
                    person.name,
                    "i"
                ),
                ""
            );
    }

    if(person.relationship){

        message=
            message.replace(
                new RegExp(
                    person.relationship,
                    "i"
                ),
                ""
            );
    }

    message=
        message.replace(
            /^text my /i,""
        )
        .replace(
            /^text /i,""
        )
        .replace(
            /^message my /i,""
        )
        .replace(
            /^message /i,""
        )
        .replace(
            /^send a text to /i,""
        )
        .replace(
            /^(that|saying|say|to say)\s+/i,""
        )
        .trim();

    return message;
}


document
.getElementById("sendText")
.onclick=()=>{

    const person=
        people.find(
            p =>
            p.id ===
            document
            .getElementById("sendText")
            .dataset.personId
        );

    const message=
        document
        .getElementById("sendText")
        .dataset.message;

    if(!person)return;

    addMessage(message);

    confirmPanel.classList.remove("show");

    openThread(person);

    if(person.phone){

        window.location.href=
            "sms:"+
            person.phone+
            "?&body="+
            encodeURIComponent(message);
    }
};


document
.getElementById("cancelText")
.onclick=()=>{
    confirmPanel.classList.remove("show");
};


document
.getElementById("cancelVoice")
.onclick=()=>{

    if(recognition){
        recognition.stop();
    }

    voicePanel.classList.remove("show");
};


document
.getElementById("sayMessage")
.onclick=()=>{

    startThreadVoice();

};


document
.getElementById("typeMessage")
.onclick=()=>{

    document
    .getElementById("textEntry")
    .classList.toggle("show");

    document
    .getElementById("typedMessage")
    .focus();
};


function startThreadVoice(){

    if(!selectedPerson)return;

    if(!SpeechRecognition){

        showToast(
            "Voice recognition isn't supported here."
        );

        return;
    }

    voicePanel.classList.add("show");

    voiceTitle.textContent=
        "What would you like to say?";

    voiceInstruction.textContent=
        "Speak your message.";

    const r=
        new SpeechRecognition();

    r.lang="en-CA";

    r.interimResults=false;

    r.onresult=event=>{

        const text=
            event.results[0][0]
            .transcript
            .trim();

        voicePanel.classList.remove("show");

        sendThreadMessage(text);
    };

    r.onerror=()=>{

        voicePanel.classList.remove("show");

        showToast(
            "I didn't catch that."
        );
    };

    r.start();
}


function sendThreadMessage(text){

    if(!text || !selectedPerson)return;

    addMessage(text);

    if(selectedPerson.phone){

        window.location.href=
            "sms:"+
            selectedPerson.phone+
            "?&body="+
            encodeURIComponent(text);
    }
}


document
.getElementById("sendTyped")
.onclick=()=>{

    const input=
        document.getElementById("typedMessage");

    const text=input.value.trim();

    if(!text)return;

    sendThreadMessage(text);

    input.value="";
};


document
.getElementById("typedMessage")
.addEventListener("keydown",e=>{

    if(e.key==="Enter"){

        document
        .getElementById("sendTyped")
        .click();

    }
});


/* PEOPLE MANAGEMENT */

function renderEditors(){

    peopleEditors.innerHTML="";

    people.forEach(person=>{

        const editor=
            document.createElement("div");

        editor.className="person-editor";

        editor.innerHTML=`

            <label>
                Name
                <input class="name"
                       value="${escapeAttribute(person.name)}">
            </label>

            <label>
                Relationship
                <input class="relationshipInput"
                       value="${escapeAttribute(person.relationship)}">
            </label>

            <label>
                Phone number
                <input class="phone"
                       type="tel"
                       value="${escapeAttribute(person.phone)}">
            </label>

            <label>
                Icon
                <select class="icon">

                    <option value="👤">👤 Person</option>
                    <option value="👩">👩 Woman</option>
                    <option value="👨">👨 Man</option>
                    <option value="👧">👧 Girl</option>
                    <option value="👦">👦 Boy</option>
                    <option value="❤️">❤️ Family</option>

                </select>
            </label>

            <label>
                <input class="help"
                       type="checkbox">
                Use this person for HELP
            </label>

            <div class="editor-buttons">

                <button class="save-person">
                    Save
                </button>

                <button class="delete-person">
                    Delete
                </button>

            </div>
        `;

        editor.querySelector(".icon").value=
            person.icon || "👤";

        editor.querySelector(".help").checked=
            person.help===true;


        editor.querySelector(".save-person")
        .onclick=()=>{

            person.name=
                editor.querySelector(".name")
                .value.trim();

            person.relationship=
                editor.querySelector(".relationshipInput")
                .value.trim();

            person.phone=
                editor.querySelector(".phone")
                .value.trim();

            person.icon=
                editor.querySelector(".icon")
                .value;

            person.help=
                editor.querySelector(".help")
                .checked;

            if(person.help){

                people.forEach(other=>{

                    if(other.id!==person.id){
                        other.help=false;
                    }

                });
            }

            savePeople();

            renderContacts();

            renderEditors();

            showToast("Contact saved ❤️");
        };


        editor.querySelector(".delete-person")
        .onclick=()=>{

            if(!confirm(
                `Delete ${person.name}?`
            ))return;

            people=
                people.filter(
                    p=>p.id!==person.id
                );

            delete conversations[person.id];

            savePeople();

            saveConversations();

            renderContacts();

            renderEditors();

            showToast("Contact deleted.");
        };


        peopleEditors.appendChild(editor);

    });
}


document
.getElementById("addPerson")
.onclick=()=>{

    people.push({

        id:crypto.randomUUID(),

        name:"New Person",

        relationship:"Friend",

        phone:"",

        icon:"👤",

        help:false

    });

    savePeople();

    renderContacts();

    renderEditors();

    showToast("New person added.");

};


function showToast(message){

    const toast=
        document.getElementById("toast");

    toast.textContent=message;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },3000);
}


function escapeHTML(text){

    return String(text||"")
        .replace(
            /[&<>"']/g,
            c=>({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            })[c]
        );
}


function escapeAttribute(text){

    return escapeHTML(text);
}


renderContacts();
renderEditors();

</script>
