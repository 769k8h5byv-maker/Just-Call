<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Just Call</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f8f5ff);
    color: #20252d;
}

.app {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    margin: auto;
    padding: 28px 20px 40px;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    width: 68px;
    height: 68px;
    margin: 0 auto 12px;
    border-radius: 22px;
    background: #20252d;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    box-shadow: 0 12px 30px rgba(0,0,0,.15);
}

h1 {
    margin: 0;
    font-size: 43px;
    letter-spacing: -1.5px;
}

.subtitle {
    margin-top: 6px;
    color: #69717d;
    font-size: 19px;
}


/* =========================
   MAIN ACTIONS
========================= */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 25px;
}

.action {
    border: none;
    border-radius: 30px;
    min-height: 190px;
    color: white;
    cursor: pointer;
    box-shadow: 0 15px 35px rgba(0,0,0,.14);
    transition: .18s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.action:hover {
    transform: translateY(-3px);
}

.action:active {
    transform: scale(.97);
}

.call-action {
    background: linear-gradient(145deg, #168b4b, #32ad68);
}

.text-action {
    background: linear-gradient(145deg, #5367df, #7585ef);
}

.action-icon {
    font-size: 62px;
    margin-bottom: 10px;
}

.action-title {
    font-size: 30px;
    font-weight: 800;
}

.action-subtitle {
    font-size: 15px;
    opacity: .85;
    margin-top: 4px;
}


/* =========================
   LISTENING PANEL
========================= */

.voice-panel {
    display: none;
    background: white;
    border-radius: 28px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 12px 35px rgba(48,63,90,.10);
    margin-bottom: 25px;
}

.voice-panel.show {
    display: block;
}

.voice-circle {
    width: 135px;
    height: 135px;
    border-radius: 50%;
    margin: auto;
    background: #20252d;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
    animation: pulse 1.3s infinite;
}

.voice-title {
    margin-top: 20px;
    font-size: 27px;
    font-weight: 750;
}

.voice-instruction {
    margin-top: 7px;
    color: #727a85;
    font-size: 18px;
}

.cancel {
    margin-top: 20px;
    border: none;
    padding: 12px 25px;
    border-radius: 12px;
    background: #eee;
    font-size: 16px;
    cursor: pointer;
}

@keyframes pulse {

    0% {
        box-shadow: 0 0 0 0 rgba(84,105,225,.35);
    }

    70% {
        box-shadow: 0 0 0 25px rgba(84,105,225,0);
    }

    100% {
        box-shadow: 0 0 0 0 rgba(84,105,225,0);
    }

}


/* =========================
   TEXT CONFIRMATION
========================= */

.confirm-panel {
    display: none;
    background: white;
    border-radius: 28px;
    padding: 28px 22px;
    box-shadow: 0 12px 35px rgba(48,63,90,.10);
    margin-bottom: 25px;
    text-align: center;
}

.confirm-panel.show {
    display: block;
}

.confirm-icon {
    font-size: 55px;
}

.confirm-title {
    font-size: 25px;
    font-weight: 750;
    margin-top: 8px;
}

.confirm-to {
    color: #707985;
    margin-top: 5px;
}

.message-box {
    margin-top: 20px;
    padding: 20px;
    border-radius: 18px;
    background: #f1f3ff;
    font-size: 21px;
    line-height: 1.4;
    text-align: left;
}

.confirm-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
}

.yes-button,
.no-button {
    border: none;
    border-radius: 15px;
    padding: 17px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
}

.yes-button {
    background: #24934d;
    color: white;
}

.no-button {
    background: #eee;
    color: #333;
}


/* =========================
   CONTACTS
========================= */

.section-title {
    font-size: 21px;
    font-weight: 750;
    margin: 25px 5px 12px;
}

.contacts {
    display: grid;
    gap: 12px;
}

.contact {
    width: 100%;
    border: none;
    border-radius: 22px;
    background: white;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 7px 25px rgba(48,63,90,.08);
    transition: .18s;
}

.contact:hover {
    transform: translateY(-2px);
}

.avatar {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    border-radius: 20px;
    background: #edf1f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
}

.contact-info {
    flex: 1;
}

.contact-name {
    font-size: 23px;
    font-weight: 700;
}

.relationship {
    color: #747d88;
    margin-top: 3px;
    font-size: 16px;
}

.contact-action {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #e8f7ed;
    color: #24934d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}


/* =========================
   SETUP
========================= */

.setup {
    margin-top: 30px;
    background: white;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 7px 25px rgba(48,63,90,.08);
}

summary {
    cursor: pointer;
    font-weight: 700;
    font-size: 18px;
}

.form {
    margin-top: 18px;
}

label {
    display: block;
    margin-top: 15px;
    font-size: 15px;
    font-weight: 600;
    color: #5d6570;
}

input {
    width: 100%;
    margin-top: 6px;
    padding: 14px;
    border: 1px solid #d9dde4;
    border-radius: 12px;
    font-size: 17px;
    outline: none;
}

.save {
    width: 100%;
    margin-top: 20px;
    border: none;
    border-radius: 13px;
    padding: 15px;
    background: #20252d;
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
}


/* =========================
   TOAST
========================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translate(-50%, 120px);
    background: #20252d;
    color: white;
    padding: 16px 22px;
    border-radius: 15px;
    font-size: 17px;
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
    transition: .3s;
    z-index: 10;
    max-width: 90%;
    text-align: center;
}

.toast.show {
    transform: translate(-50%, 0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:450px) {

    .app {
        padding: 22px 15px 35px;
    }

    h1 {
        font-size: 37px;
    }

    .actions {
        gap: 11px;
    }

    .action {
        min-height: 165px;
        border-radius: 25px;
    }

    .action-icon {
        font-size: 50px;
    }

    .action-title {
        font-size: 25px;
    }

}

</style>
</head>


<body>

<div class="app">


    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            ☎
        </div>

        <h1>
            Just Call
        </h1>

        <div class="subtitle">
            What would you like to do?
        </div>

    </div>



    <!-- TWO BIG BUTTONS -->

    <div class="actions">

        <button
            class="action call-action"
            id="callButton"
        >

            <div class="action-icon">
                ☎️
            </div>

            <div class="action-title">
                CALL
            </div>

            <div class="action-subtitle">
                Tell me who to call
            </div>

        </button>



        <button
            class="action text-action"
            id="textButton"
        >

            <div class="action-icon">
                💬
            </div>

            <div class="action-title">
                TEXT
            </div>

            <div class="action-subtitle">
                Tell me what to say
            </div>

        </button>

    </div>



    <!-- VOICE PANEL -->

    <div
        class="voice-panel"
        id="voicePanel"
    >

        <div
            class="voice-circle"
            id="voiceIcon"
        >
            🎙️
        </div>

        <div
            class="voice-title"
            id="voiceTitle"
        >
            I'm listening
        </div>

        <div
            class="voice-instruction"
            id="voiceInstruction"
        >
            Tell me who you'd like to call.
        </div>

        <button
            class="cancel"
            id="cancelVoice"
        >
            Cancel
        </button>

    </div>



    <!-- TEXT CONFIRMATION -->

    <div
        class="confirm-panel"
        id="confirmPanel"
    >

        <div class="confirm-icon">
            💬
        </div>

        <div
            class="confirm-title"
            id="confirmTitle"
        >
            Ready to send
        </div>

        <div
            class="confirm-to"
            id="confirmTo"
        >
        </div>


        <div
            class="message-box"
            id="messageBox"
        >
        </div>


        <div class="confirm-buttons">

            <button
                class="yes-button"
                id="sendText"
            >
                ✓ SEND
            </button>

            <button
                class="no-button"
                id="cancelText"
            >
                ✕ CANCEL
            </button>

        </div>

    </div>



    <!-- CONTACTS -->

    <div class="section-title">
        Family & friends
    </div>

    <div
        class="contacts"
        id="contacts"
    >
    </div>



    <!-- SETUP -->

    <details class="setup">

        <summary>
            ⚙️ Family setup
        </summary>


        <div class="form">


            <label>
                Granddaughter's name
                <input id="granddaughterName">
            </label>

            <label>
                Phone number
                <input
                    id="granddaughterPhone"
                    type="tel"
                >
            </label>



            <label>
                Daughter's name
                <input id="daughterName">
            </label>

            <label>
                Phone number
                <input
                    id="daughterPhone"
                    type="tel"
                >
            </label>



            <label>
                Son's name
                <input id="sonName">
            </label>

            <label>
                Phone number
                <input
                    id="sonPhone"
                    type="tel"
                >
            </label>



            <label>
                Brother's name
                <input id="brotherName">
            </label>

            <label>
                Phone number
                <input
                    id="brotherPhone"
                    type="tel"
                >
            </label>



            <button
                class="save"
                id="save"
            >
                Save family contacts
            </button>

        </div>

    </details>


</div>


<div
    class="toast"
    id="toast"
>
</div>



<script>


/* =========================
   CONTACT DATA
========================= */

const defaultContacts = {

    granddaughterName: "Sarah",
    granddaughterPhone: "",

    daughterName: "Susan",
    daughterPhone: "",

    sonName: "Michael",
    sonPhone: "",

    brotherName: "John",
    brotherPhone: ""

};


let contacts =
    JSON.parse(
        localStorage.getItem("justCallContacts")
    ) || defaultContacts;



/* =========================
   ELEMENTS
========================= */

const callButton =
    document.getElementById("callButton");

const textButton =
    document.getElementById("textButton");

const voicePanel =
    document.getElementById("voicePanel");

const voiceTitle =
    document.getElementById("voiceTitle");

const voiceInstruction =
    document.getElementById("voiceInstruction");

const voiceIcon =
    document.getElementById("voiceIcon");

const cancelVoice =
    document.getElementById("cancelVoice");

const confirmPanel =
    document.getElementById("confirmPanel");

const confirmTo =
    document.getElementById("confirmTo");

const messageBox =
    document.getElementById("messageBox");

const sendText =
    document.getElementById("sendText");

const cancelText =
    document.getElementById("cancelText");

const contactsContainer =
    document.getElementById("contacts");

const toast =
    document.getElementById("toast");



/* =========================
   RENDER CONTACTS
========================= */

function renderContacts() {

    contactsContainer.innerHTML = "";

    addContact(
        "👧",
        contacts.granddaughterName,
        "Granddaughter",
        "granddaughter"
    );

    addContact(
        "👩",
        contacts.daughterName,
        "Daughter",
        "daughter"
    );

    addContact(
        "👨",
        contacts.sonName,
        "Son",
        "son"
    );

    addContact(
        "👨",
        contacts.brotherName,
        "Brother",
        "brother"
    );

}



function addContact(
    icon,
    name,
    relationship,
    key
) {

    if (!name) return;


    const button =
        document.createElement("button");

    button.className = "contact";


    button.innerHTML = `

        <div class="avatar">
            ${icon}
        </div>

        <div class="contact-info">

            <div class="contact-name">
                ${escapeHTML(name)}
            </div>

            <div class="relationship">
                ${relationship}
            </div>

        </div>

        <div class="contact-action">
            ☎
        </div>

    `;


    button.onclick = () => {

        callPerson(key);

    };


    contactsContainer.appendChild(button);

}



/* =========================
   CALL
========================= */

function callPerson(key) {

    const name =
        contacts[key + "Name"];

    const phone =
        contacts[key + "Phone"];


    if (!phone) {

        showToast(
            `No phone number saved for ${name}.`
        );

        return;

    }


    window.location.href =
        "tel:" + phone;

}



/* =========================
   VOICE RECOGNITION
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let currentMode = null;

let recognition = null;



function startListening(mode) {

    if (!SpeechRecognition) {

        showToast(
            "Voice recognition isn't supported in this browser."
        );

        return;

    }


    currentMode = mode;


    voicePanel.classList.add("show");

    confirmPanel.classList.remove("show");


    if (mode === "call") {

        voiceTitle.textContent =
            "Who would you like to call?";

        voiceInstruction.textContent =
            'Try saying "Call my brother."';

    }


    if (mode === "text") {

        voiceTitle.textContent =
            "Who would you like to text?";

        voiceInstruction.textContent =
            'Try saying "Text my daughter that I am home."';

    }


    recognition =
        new SpeechRecognition();


    recognition.lang = "en-CA";

    recognition.interimResults = false;

    recognition.maxAlternatives = 3;


    recognition.onresult = event => {

        const spoken =
            event.results[0][0]
            .transcript
            .trim();


        voicePanel.classList.remove("show");


        if (currentMode === "call") {

            processCall(spoken);

        }

        if (currentMode === "text") {

            processText(spoken);

        }

    };


    recognition.onerror = () => {

        voicePanel.classList.remove("show");

        showToast(
            "I didn't catch that. Please try again."
        );

    };


    recognition.onend = () => {

        voiceIcon.textContent = "🎙️";

    };


    recognition.start();

}



/* =========================
   CALL COMMAND
========================= */

function processCall(spoken) {

    const person =
        findPerson(spoken);


    if (!person) {

        showToast(
            'I don\'t know who you mean. Try "Call my brother."'
        );

        return;

    }


    const phone =
        contacts[person.key + "Phone"];


    if (!phone) {

        showToast(
            `No phone number saved for ${person.name}.`
        );

        return;

    }


    showToast(
        `Calling ${person.name}…`
    );


    setTimeout(() => {

        window.location.href =
            "tel:" + phone;

    }, 600);

}



/* =========================
   TEXT COMMAND
========================= */

function processText(spoken) {

    const person =
        findPerson(spoken);


    if (!person) {

        showToast(
            'Try "Text my daughter that I am home."'
        );

        return;

    }


    const message =
        extractMessage(
            spoken,
            person
        );


    if (!message) {

        showToast(
            "I heard the person, but not the message."
        );

        return;

    }


    const phone =
        contacts[person.key + "Phone"];


    if (!phone) {

        showToast(
            `No phone number saved for ${person.name}.`
        );

        return;

    }


    confirmTo.textContent =
        "To " + person.name;


    messageBox.textContent =
        message;


    confirmPanel.classList.add("show");


    sendText.dataset.phone =
        phone;


    sendText.dataset.message =
        message;


    sendText.dataset.name =
        person.name;

}



/* =========================
   FIND PERSON
========================= */

function findPerson(text) {

    const lower =
        text.toLowerCase();


    const people = [

        {
            key: "granddaughter",
            name: contacts.granddaughterName,
            words: [
                "granddaughter",
                "grand daughter"
            ]
        },

        {
            key: "daughter",
            name: contacts.daughterName,
            words: [
                "daughter"
            ]
        },

        {
            key: "son",
            name: contacts.sonName,
            words: [
                "son"
            ]
        },

        {
            key: "brother",
            name: contacts.brotherName,
            words: [
                "brother"
            ]
        }

    ];


    for (const person of people) {

        if (
            person.name &&
            lower.includes(
                person.name.toLowerCase()
            )
        ) {

            return person;

        }

    }


    for (const person of people) {

        for (const word of person.words) {

            if (lower.includes(word)) {

                return person;

            }

        }

    }


    return null;

}



/* =========================
   EXTRACT TEXT MESSAGE
========================= */

function extractMessage(
    spoken,
    person
) {

    let message =
        spoken.trim();


    const lower =
        message.toLowerCase();


    const name =
        person.name
        ? person.name.toLowerCase()
        : "";


    if (name) {

        message =
            message.replace(
                new RegExp(
                    name,
                    "i"
                ),
                ""
            );

    }


    const phrases = [

        /^text my /i,
        /^text the /i,
        /^text /i,

        /^message my /i,
        /^message the /i,
        /^message /i,

        /^send a text to my /i,
        /^send a text to /i,

        /^send my /i

    ];


    for (const phrase of phrases) {

        message =
            message.replace(
                phrase,
                ""
            );

    }


    const relationshipWords = [

        "granddaughter",
        "grand daughter",
        "daughter",
        "son",
        "brother"

    ];


    for (
        const relationship
        of relationshipWords
    ) {

        message =
            message.replace(
                new RegExp(
                    relationship,
                    "i"
                ),
                ""
            );

    }


    message =
        message
        .replace(
            /^(that|saying|say|to say)\s+/i,
            ""
        )
        .trim();


    return message;

}



/* =========================
   SEND TEXT
========================= */

sendText.onclick = () => {

    const phone =
        sendText.dataset.phone;

    const message =
        sendText.dataset.message;

    const name =
        sendText.dataset.name;


    /*
       On a real phone this opens
       the native Messages app.
    */

    const smsURL =
        "sms:" +
        phone +
        "?&body=" +
        encodeURIComponent(message);


    confirmPanel.classList.remove("show");


    showToast(
        `Opening Messages for ${name}…`
    );


    setTimeout(() => {

        window.location.href =
            smsURL;

    }, 500);

};



/* =========================
   CANCEL
========================= */

cancelVoice.onclick = () => {

    if (recognition) {

        recognition.stop();

    }

    voicePanel.classList.remove(
        "show"
    );

};


cancelText.onclick = () => {

    confirmPanel.classList.remove(
        "show"
    );

};



/* =========================
   BUTTONS
========================= */

callButton.onclick = () => {

    startListening("call");

};


textButton.onclick = () => {

    startListening("text");

};



/* =========================
   SAVE CONTACTS
========================= */

document.getElementById("save").onclick =
() => {

    contacts = {

        granddaughterName:
            document
            .getElementById(
                "granddaughterName"
            )
            .value.trim(),

        granddaughterPhone:
            document
            .getElementById(
                "granddaughterPhone"
            )
            .value.trim(),


        daughterName:
            document
            .getElementById(
                "daughterName"
            )
            .value.trim(),

        daughterPhone:
            document
            .getElementById(
                "daughterPhone"
            )
            .value.trim(),


        sonName:
            document
            .getElementById(
                "sonName"
            )
            .value.trim(),

        sonPhone:
            document
            .getElementById(
                "sonPhone"
            )
            .value.trim(),


        brotherName:
            document
            .getElementById(
                "brotherName"
            )
            .value.trim(),

        brotherPhone:
            document
            .getElementById(
                "brotherPhone"
            )
            .value.trim()

    };


    localStorage.setItem(
        "justCallContacts",
        JSON.stringify(contacts)
    );


    renderContacts();


    showToast(
        "Family contacts saved ❤️"
    );

};



/* =========================
   LOAD SETUP
========================= */

function loadSetup() {

    const fields = [

        "granddaughterName",
        "granddaughterPhone",

        "daughterName",
        "daughterPhone",

        "sonName",
        "sonPhone",

        "brotherName",
        "brotherPhone"

    ];


    fields.forEach(field => {

        document.getElementById(field).value =
            contacts[field] || "";

    });

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    return String(text || "")
        .replace(
            /[&<>"']/g,
            character => {

                const replacements = {

                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"

                };

                return replacements[
                    character
                ];

            }
        );

}



/* =========================
   TOAST
========================= */

function showToast(message) {

    toast.textContent =
        message;

    toast.classList.add("show");


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 3000);

}



/* =========================
   START
========================= */

loadSetup();

renderContacts();

</script>

</body>
</html>
