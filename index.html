<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Emergency Contacts</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      margin: 0 auto;
      background: #f3f4f6;
      padding-bottom: 30px;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      background: white;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid #e5e7eb;
    }

    .help-button {
      width: 100%;
      min-height: 72px;

      border: none;
      border-radius: 18px;

      background: #dc2626;
      color: white;

      font-size: 26px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 4px 10px rgba(220, 38, 38, 0.30);
    }

    .help-button:active {
      transform: scale(0.97);
    }


    /* =========================
       HELP PANEL
    ========================= */

    .help-box {
      display: none;

      margin: 16px;

      padding: 20px;

      background: white;

      border-radius: 18px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .help-box h2 {
      margin: 0 0 10px;

      font-size: 22px;
    }

    .help-box p {
      margin: 8px 0;

      line-height: 1.5;

      color: #4b5563;
    }

    .close-help {
      width: 100%;

      min-height: 50px;

      margin-top: 14px;

      border: none;

      border-radius: 12px;

      background: #e5e7eb;

      color: #374151;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;
    }


    /* =========================
       CONTACT AREA
    ========================= */

    .contacts {
      padding: 16px;
    }

    .contacts-heading {
      margin: 4px 0 14px;

      text-align: center;

      font-size: 22px;
      font-weight: 700;
    }


    /* =========================
       CONTACT CARD
    ========================= */

    .contact {
      background: white;

      border-radius: 18px;

      margin-bottom: 14px;

      padding: 16px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .contact-top {
      display: flex;

      align-items: center;

      gap: 14px;

      margin-bottom: 14px;
    }

    .avatar {
      width: 52px;
      height: 52px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #e5e7eb;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 21px;

      font-weight: 800;
    }

    .contact-info {
      flex: 1;

      min-width: 0;
    }

    .contact-name {
      margin: 0 0 4px;

      font-size: 20px;

      font-weight: 700;
    }

    .contact-number {
      margin: 0;

      font-size: 15px;

      color: #6b7280;
    }


    /* =========================
       CALL / TEXT BUTTONS
    ========================= */

    .actions {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-bottom: 10px;
    }

    .action-button {
      min-height: 52px;

      border: none;

      border-radius: 13px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      text-decoration: none;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;
    }

    .call-button {
      background: #16a34a;

      color: white;
    }

    .text-button {
      background: #2563eb;

      color: white;
    }

    .action-button:active {
      transform: scale(0.97);
    }


    /* =========================
       EDIT / DELETE
    ========================= */

    .manage-buttons {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    .edit-button,
    .delete-button {
      min-height: 44px;

      border: none;

      border-radius: 11px;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;
    }

    .edit-button {
      background: #f1f5f9;

      color: #334155;
    }

    .delete-button {
      background: #fee2e2;

      color: #b91c1c;
    }

    .edit-button:active,
    .delete-button:active {
      transform: scale(0.97);
    }


    /* =========================
       ADD CONTACT
    ========================= */

    .add-contact-button {
      width: 100%;

      min-height: 58px;

      margin-top: 2px;

      border: none;

      border-radius: 15px;

      background: #111827;

      color: white;

      font-size: 18px;

      font-weight: 700;

      cursor: pointer;
    }

    .add-contact-button:active {
      transform: scale(0.98);
    }


    /* =========================
       EMPTY CONTACT LIST
    ========================= */

    .empty {
      background: white;

      border-radius: 18px;

      padding: 30px 20px;

      margin-bottom: 14px;

      text-align: center;

      color: #6b7280;
    }


    /* =========================
       MODAL
    ========================= */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 100;

      background: rgba(0, 0, 0, 0.50);

      padding: 20px;

      align-items: center;

      justify-content: center;
    }

    .modal-content {
      width: 100%;

      max-width: 500px;

      background: white;

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.25);
    }

    .modal-title {
      margin: 0 0 18px;

      font-size: 24px;
    }

    .form-label {
      display: block;

      margin: 14px 0 6px;

      font-size: 15px;

      font-weight: 700;
    }

    .form-input {
      width: 100%;

      min-height: 52px;

      padding: 0 14px;

      border: 1px solid #d1d5db;

      border-radius: 12px;

      font-size: 17px;

      outline: none;
    }

    .form-input:focus {
      border-color: #2563eb;
    }

    .modal-buttons {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 20px;
    }

    .save-button,
    .cancel-button {
      min-height: 52px;

      border: none;

      border-radius: 12px;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;
    }

    .save-button {
      background: #16a34a;

      color: white;
    }

    .cancel-button {
      background: #e5e7eb;

      color: #374151;
    }


    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 380px) {

      .help-button {
        font-size: 23px;

        min-height: 68px;
      }

      .contacts {
        padding: 12px;
      }

      .contact {
        padding: 14px;
      }

      .action-button {
        font-size: 16px;
      }
    }

  </style>
</head>


<body>

  <div class="app">


    <!-- =========================
         HELP BUTTON
    ========================= -->

    <header>

      <button
        class="help-button"
        type="button"
        onclick="toggleHelp()"
      >
        🆘 HELP
      </button>

    </header>


    <!-- =========================
         HELP INFORMATION
    ========================= -->

    <div
      class="help-box"
      id="helpBox"
    >

      <h2>Need Help?</h2>

      <p>
        Choose a contact below and tap
        <strong>Call</strong>
        to phone them.
      </p>

      <p>
        Tap
        <strong>Text</strong>
        to send them a text message.
      </p>

      <p>
        You can add, edit, or delete contacts whenever you want.
      </p>

      <button
        class="close-help"
        type="button"
        onclick="toggleHelp()"
      >
        Close
      </button>

    </div>


    <!-- =========================
         CONTACTS
    ========================= -->

    <main class="contacts">

      <h1 class="contacts-heading">
        Emergency Contacts
      </h1>

      <div id="contactList"></div>


      <!-- ADD CONTACT -->

      <button
        class="add-contact-button"
        type="button"
        onclick="openAddContact()"
      >
        ＋ Add Contact
      </button>

    </main>

  </div>


  <!-- =========================
       ADD / EDIT CONTACT WINDOW
  ========================= -->

  <div
    class="modal"
    id="contactModal"
  >

    <div class="modal-content">

      <h2
        class="modal-title"
        id="modalTitle"
      >
        Add Contact
      </h2>


      <label
        class="form-label"
        for="nameInput"
      >
        Name
      </label>

      <input
        class="form-input"
        id="nameInput"
        type="text"
        placeholder="Contact name"
        autocomplete="name"
      >


      <label
        class="form-label"
        for="phoneInput"
      >
        Phone Number
      </label>

      <input
        class="form-input"
        id="phoneInput"
        type="tel"
        placeholder="902-555-1234"
        autocomplete="tel"
      >


      <div class="modal-buttons">

        <button
          class="cancel-button"
          type="button"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          class="save-button"
          type="button"
          onclick="saveContact()"
        >
          Save
        </button>

      </div>

    </div>

  </div>


  <script>


    /* =========================
       CONTACT DATA
    ========================= */

    let contacts =
      JSON.parse(
        localStorage.getItem("emergencyContacts")
      ) || [

        {
          id: 1,
          name: "Brian",
          phone: "902-555-0101"
        },

        {
          id: 2,
          name: "Lisa",
          phone: "902-555-0102"
        },

        {
          id: 3,
          name: "Mom",
          phone: "902-555-0103"
        }

      ];


    let editingId = null;


    /* =========================
       SAVE CONTACTS
    ========================= */

    function saveContacts() {

      localStorage.setItem(
        "emergencyContacts",
        JSON.stringify(contacts)
      );

    }


    /* =========================
       DISPLAY CONTACTS
    ========================= */

    function renderContacts() {

      const list =
        document.getElementById("contactList");

      list.innerHTML = "";


      if (contacts.length === 0) {

        list.innerHTML = `
          <div class="empty">
            <strong>No contacts yet.</strong>
            <p>Tap "Add Contact" below.</p>
          </div>
        `;

        return;
      }


      contacts.forEach(function(contact) {

        const card =
          document.createElement("div");

        card.className = "contact";


        const firstLetter =
          contact.name
            .trim()
            .charAt(0)
            .toUpperCase();


        card.innerHTML = `

          <div class="contact-top">

            <div class="avatar">
              ${escapeHtml(firstLetter)}
            </div>

            <div class="contact-info">

              <div class="contact-name">
                ${escapeHtml(contact.name)}
              </div>

              <div class="contact-number">
                ${escapeHtml(contact.phone)}
              </div>

            </div>

          </div>


          <div class="actions">

            <a
              class="action-button call-button"
              href="tel:${phoneForLink(contact.phone)}"
            >
              ☎️ Call
            </a>


            <a
              class="action-button text-button"
              href="sms:${phoneForLink(contact.phone)}"
            >
              💬 Text
            </a>

          </div>


          <div class="manage-buttons">

            <button
              class="edit-button"
              type="button"
              onclick="editContact(${contact.id})"
            >
              ✏️ Edit
            </button>


            <button
              class="delete-button"
              type="button"
              onclick="deleteContact(${contact.id})"
            >
              🗑️ Delete
            </button>

          </div>

        `;


        list.appendChild(card);

      });

    }


    /* =========================
       ADD CONTACT
    ========================= */

    function openAddContact() {

      editingId = null;


      document.getElementById("modalTitle")
        .textContent = "Add Contact";


      document.getElementById("nameInput")
        .value = "";


      document.getElementById("phoneInput")
        .value = "";


      document.getElementById("contactModal")
        .style.display = "flex";


      setTimeout(function() {

        document
          .getElementById("nameInput")
          .focus();

      }, 100);

    }


    /* =========================
       EDIT CONTACT
    ========================= */

    function editContact(id) {

      const contact =
        contacts.find(function(c) {

          return c.id === id;

        });


      if (!contact) return;


      editingId = id;


      document.getElementById("modalTitle")
        .textContent = "Edit Contact";


      document.getElementById("nameInput")
        .value = contact.name;


      document.getElementById("phoneInput")
        .value = contact.phone;


      document.getElementById("contactModal")
        .style.display = "flex";

    }


    /* =========================
       SAVE CONTACT
    ========================= */

    function saveContact() {

      const name =
        document
          .getElementById("nameInput")
          .value
          .trim();


      const phone =
        document
          .getElementById("phoneInput")
          .value
          .trim();


      if (!name) {

        alert("Please enter a name.");

        return;

      }


      if (!phone) {

        alert("Please enter a phone number.");

        return;

      }


      /* ADD */

      if (editingId === null) {

        contacts.push({

          id: Date.now(),

          name: name,

          phone: phone

        });

      }


      /* EDIT */

      else {

        const contact =
          contacts.find(function(c) {

            return c.id === editingId;

          });


        if (contact) {

          contact.name = name;

          contact.phone = phone;

        }

      }


      saveContacts();

      renderContacts();

      closeModal();

    }


    /* =========================
       DELETE CONTACT
    ========================= */

    function deleteContact(id) {

      const contact =
        contacts.find(function(c) {

          return c.id === id;

        });


      if (!contact) return;


      const confirmed =
        confirm(
          "Delete " +
          contact.name +
          " from your contacts?"
        );


      if (!confirmed) return;


      contacts =
        contacts.filter(function(c) {

          return c.id !== id;

        });


      saveContacts();

      renderContacts();

    }


    /* =========================
       CLOSE MODAL
    ========================= */

    function closeModal() {

      document.getElementById("contactModal")
        .style.display = "none";

    }


    /* =========================
       HELP BUTTON
    ========================= */

    function toggleHelp() {

      const helpBox =
        document.getElementById("helpBox");


      if (
        helpBox.style.display === "block"
      ) {

        helpBox.style.display = "none";

      }

      else {

        helpBox.style.display = "block";

      }

    }


    /* =========================
       PHONE NUMBER
    ========================= */

    function phoneForLink(phone) {

      return phone.replace(
        /[^0-9+]/g,
        ""
      );

    }


    /* =========================
       SAFE TEXT
    ========================= */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    /* =========================
       START APP
    ========================= */

    saveContacts();

    renderContacts();

  </script>

</body>
</html>
