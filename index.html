<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Family Connect</title>

  <style>

    /* ==============================
       BASIC
    ============================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f3f4f6;
      color: #111827;
    }

    button,
    a,
    input {
      font-family: inherit;
    }


    /* ==============================
       APP
    ============================== */

    .app {
      width: 100%;
      max-width: 600px;

      min-height: 100vh;

      margin: 0 auto;

      padding: 18px 16px 30px;

      background: #f3f4f6;
    }


    /* ==============================
       TOP BAR
    ============================== */

    .top-bar {
      height: 52px;

      display: flex;

      align-items: center;
      justify-content: flex-end;

      margin-bottom: 8px;
    }

    .settings-button {
      width: 48px;
      height: 48px;

      border: none;
      border-radius: 50%;

      background: white;

      color: #374151;

      font-size: 27px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .settings-button:active {
      transform: scale(0.93);
    }


    /* ==============================
       CONTACT LIST
    ============================== */

    .contacts {
      display: flex;
      flex-direction: column;

      gap: 14px;
    }


    /* ==============================
       CONTACT CARD
    ============================== */

    .contact-card {
      background: white;

      border-radius: 18px;

      padding: 18px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.07);
    }

    .contact-name {
      margin: 0 0 14px;

      font-size: 24px;

      font-weight: 750;

      color: #111827;
    }


    /* ==============================
       CALL / TEXT
    ============================== */

    .contact-actions {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;
    }

    .call-button,
    .text-button {
      min-height: 58px;

      border: none;

      border-radius: 14px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      text-decoration: none;

      font-size: 19px;

      font-weight: 750;

      cursor: pointer;
    }

    .call-button {
      background: #16a34a;
      color: white;
    }

    .text-button {
      background: #2563eb;
      color: white;
    }

    .call-button:active,
    .text-button:active {
      transform: scale(0.97);
    }


    /* ==============================
       HELP
    ============================== */

    .help-area {
      margin-top: 22px;
    }

    .help-button {
      width: 100%;

      min-height: 82px;

      border: none;

      border-radius: 20px;

      background: #dc2626;

      color: white;

      font-size: 30px;

      font-weight: 850;

      letter-spacing: 0.5px;

      cursor: pointer;

      box-shadow:
        0 5px 12px rgba(220, 38, 38, 0.30);
    }

    .help-button:active {
      transform: scale(0.97);
    }


    /* ==============================
       HELP MESSAGE
    ============================== */

    .help-message {
      display: none;

      margin-top: 12px;

      padding: 18px;

      background: white;

      border-radius: 16px;

      text-align: center;

      font-size: 17px;

      line-height: 1.5;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .help-message.visible {
      display: block;
    }

    .help-message strong {
      color: #dc2626;
    }


    /* ==============================
       SETTINGS OVERLAY
    ============================== */

    .settings-overlay {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 100;

      background: rgba(0, 0, 0, 0.5);

      padding: 20px;

      align-items: center;
      justify-content: center;
    }

    .settings-overlay.visible {
      display: flex;
    }


    /* ==============================
       SETTINGS PANEL
    ============================== */

    .settings-panel {
      width: 100%;

      max-width: 500px;

      max-height: 90vh;

      overflow-y: auto;

      background: white;

      border-radius: 22px;

      padding: 22px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.25);
    }

    .settings-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 20px;
    }

    .settings-title {
      margin: 0;

      font-size: 25px;
    }

    .close-settings {
      width: 44px;
      height: 44px;

      border: none;

      border-radius: 50%;

      background: #f3f4f6;

      font-size: 22px;

      cursor: pointer;
    }


    /* ==============================
       FAMILY NOTICE
    ============================== */

    .family-notice {
      padding: 14px;

      margin-bottom: 18px;

      border-radius: 13px;

      background: #eff6ff;

      color: #1e40af;

      font-size: 15px;

      line-height: 1.45;
    }


    /* ==============================
       ADD BUTTON
    ============================== */

    .add-button {
      width: 100%;

      min-height: 54px;

      margin-bottom: 18px;

      border: none;

      border-radius: 13px;

      background: #111827;

      color: white;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;
    }


    /* ==============================
       MANAGEMENT CONTACT
    ============================== */

    .manage-contact {
      display: flex;

      align-items: center;

      gap: 10px;

      padding: 14px 0;

      border-top: 1px solid #e5e7eb;
    }

    .manage-contact-info {
      flex: 1;

      min-width: 0;
    }

    .manage-name {
      font-size: 17px;

      font-weight: 700;

      margin-bottom: 3px;
    }

    .manage-phone {
      font-size: 14px;

      color: #6b7280;
    }

    .edit-button,
    .delete-button {
      min-height: 42px;

      padding: 8px 12px;

      border: none;

      border-radius: 10px;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;
    }

    .edit-button {
      background: #e5e7eb;

      color: #374151;
    }

    .delete-button {
      background: #fee2e2;

      color: #b91c1c;
    }


    /* ==============================
       CONTACT FORM
    ============================== */

    .form-area {
      display: none;

      margin-top: 18px;

      padding-top: 18px;

      border-top: 1px solid #e5e7eb;
    }

    .form-area.visible {
      display: block;
    }

    .form-title {
      margin: 0 0 16px;

      font-size: 21px;
    }

    .form-label {
      display: block;

      margin: 13px 0 6px;

      font-size: 15px;

      font-weight: 700;
    }

    .form-input {
      width: 100%;

      min-height: 52px;

      padding: 0 14px;

      border: 1px solid #d1d5db;

      border-radius: 12px;

      background: white;

      font-size: 17px;

      outline: none;
    }

    .form-input:focus {
      border-color: #2563eb;
    }

    .form-buttons {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 18px;
    }

    .save-button,
    .cancel-button {
      min-height: 50px;

      border: none;

      border-radius: 12px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;
    }

    .save-button {
      background: #16a34a;

      color: white;
    }

    .cancel-button {
      background: #e5e7eb;

      color: #374151;
    }


    /* ==============================
       EMPTY STATE
    ============================== */

    .empty-message {
      padding: 30px 15px;

      background: white;

      border-radius: 18px;

      text-align: center;

      color: #6b7280;

      font-size: 17px;
    }


    /* ==============================
       SMALL PHONES
    ============================== */

    @media (max-width: 380px) {

      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .contact-card {
        padding: 15px;
      }

      .contact-name {
        font-size: 22px;
      }

      .call-button,
      .text-button {
        font-size: 17px;
      }

      .help-button {
        font-size: 27px;
      }

      .manage-contact {
        flex-wrap: wrap;
      }

      .manage-contact-info {
        width: 100%;
        flex-basis: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       ELDERLY USER DASHBOARD
  ====================================== -->

  <main class="app">


    <!-- SETTINGS GEAR -->

    <div class="top-bar">

      <button
        class="settings-button"
        type="button"
        onclick="openSettings()"
        aria-label="Family settings"
      >
        ⚙️
      </button>

    </div>


    <!-- CONTACTS -->

    <section
      class="contacts"
      id="contactList"
    >
    </section>


    <!-- HELP -->

    <div class="help-area">

      <button
        class="help-button"
        type="button"
        onclick="showHelp()"
      >
        🆘 HELP
      </button>

      <div
        class="help-message"
        id="helpMessage"
      >

        <strong>Need help?</strong>

        <br><br>

        Choose someone above to call or text.

      </div>

    </div>


  </main>


  <!-- =====================================
       FAMILY SETTINGS
  ====================================== -->

  <div
    class="settings-overlay"
    id="settingsOverlay"
  >

    <div class="settings-panel">


      <!-- SETTINGS HEADER -->

      <div class="settings-header">

        <h2 class="settings-title">
          Family Settings
        </h2>

        <button
          class="close-settings"
          type="button"
          onclick="closeSettings()"
          aria-label="Close settings"
        >
          ✕
        </button>

      </div>


      <!-- NOTICE -->

      <div class="family-notice">

        This area is for family members or caregivers.
        Changes made here will update the contacts shown
        on the main screen.

      </div>


      <!-- ADD -->

      <button
        class="add-button"
        type="button"
        onclick="showContactForm()"
      >
        ＋ Add Contact
      </button>


      <!-- CONTACT MANAGEMENT -->

      <div id="manageContactList">
      </div>


      <!-- FORM -->

      <div
        class="form-area"
        id="formArea"
      >

        <h3
          class="form-title"
          id="formTitle"
        >
          Add Contact
        </h3>


        <label
          class="form-label"
          for="nameInput"
        >
          Name
        </label>

        <input
          class="form-input"
          id="nameInput"
          type="text"
          placeholder="For example: Susan"
          autocomplete="name"
        >


        <label
          class="form-label"
          for="phoneInput"
        >
          Phone Number
        </label>

        <input
          class="form-input"
          id="phoneInput"
          type="tel"
          placeholder="902-555-1234"
          autocomplete="tel"
        >


        <div class="form-buttons">

          <button
            class="cancel-button"
            type="button"
            onclick="hideContactForm()"
          >
            Cancel
          </button>

          <button
            class="save-button"
            type="button"
            onclick="saveContact()"
          >
            Save
          </button>

        </div>

      </div>


    </div>

  </div>


  <script>


    /* =====================================
       CONTACT DATA
    ====================================== */

    let contacts =
      JSON.parse(
        localStorage.getItem("familyContacts")
      ) || [

        {
          id: 1,
          name: "Brian",
          phone: "902-555-0101"
        },

        {
          id: 2,
          name: "Lisa",
          phone: "902-555-0102"
        },

        {
          id: 3,
          name: "Mom",
          phone: "902-555-0103"
        }

      ];


    let editingId = null;


    /* =====================================
       SAVE
    ====================================== */

    function saveContacts() {

      localStorage.setItem(
        "familyContacts",
        JSON.stringify(contacts)
      );

    }


    /* =====================================
       DISPLAY MAIN DASHBOARD
    ====================================== */

    function renderContacts() {

      const list =
        document.getElementById(
          "contactList"
        );

      list.innerHTML = "";


      if (contacts.length === 0) {

        list.innerHTML = `
          <div class="empty-message">
            No contacts have been added yet.
          </div>
        `;

        return;
      }


      contacts.forEach(function(contact) {

        const card =
          document.createElement("article");

        card.className =
          "contact-card";


        card.innerHTML = `

          <h2 class="contact-name">
            ${escapeHtml(contact.name)}
          </h2>

          <div class="contact-actions">

            <a
              class="call-button"
              href="tel:${phoneForLink(contact.phone)}"
              aria-label="Call ${escapeHtml(contact.name)}"
            >
              ☎️ Call
            </a>

            <a
              class="text-button"
              href="sms:${phoneForLink(contact.phone)}"
              aria-label="Text ${escapeHtml(contact.name)}"
            >
              💬 Text
            </a>

          </div>

        `;


        list.appendChild(card);

      });

    }


    /* =====================================
       OPEN SETTINGS
    ====================================== */

    function openSettings() {

      renderManageContacts();

      document
        .getElementById("settingsOverlay")
        .classList.add("visible");

    }


    /* =====================================
       CLOSE SETTINGS
    ====================================== */

    function closeSettings() {

      hideContactForm();

      document
        .getElementById("settingsOverlay")
        .classList.remove("visible");

    }


    /* =====================================
       DISPLAY FAMILY CONTACT LIST
    ====================================== */

    function renderManageContacts() {

      const list =
        document.getElementById(
          "manageContactList"
        );

      list.innerHTML = "";


      if (contacts.length === 0) {

        list.innerHTML = `
          <div class="empty-message">
            No contacts yet.
          </div>
        `;

        return;
      }


      contacts.forEach(function(contact) {

        const row =
          document.createElement("div");

        row.className =
          "manage-contact";


        row.innerHTML = `

          <div class="manage-contact-info">

            <div class="manage-name">
              ${escapeHtml(contact.name)}
            </div>

            <div class="manage-phone">
              ${escapeHtml(contact.phone)}
            </div>

          </div>


          <button
            class="edit-button"
            type="button"
            onclick="editContact(${contact.id})"
          >
            ✏️ Edit
          </button>


          <button
            class="delete-button"
            type="button"
            onclick="deleteContact(${contact.id})"
          >
            🗑️ Delete
          </button>

        `;


        list.appendChild(row);

      });

    }


    /* =====================================
       SHOW ADD FORM
    ====================================== */

    function showContactForm() {

      editingId = null;


      document
        .getElementById("formTitle")
        .textContent =
        "Add Contact";


      document
        .getElementById("nameInput")
        .value = "";


      document
        .getElementById("phoneInput")
        .value = "";


      document
        .getElementById("formArea")
        .classList.add("visible");


      setTimeout(function() {

        document
          .getElementById("nameInput")
          .focus();

      }, 100);

    }


    /* =====================================
       EDIT CONTACT
    ====================================== */

    function editContact(id) {

      const contact =
        contacts.find(function(item) {

          return item.id === id;

        });


      if (!contact) return;


      editingId = id;


      document
        .getElementById("formTitle")
        .textContent =
        "Edit Contact";


      document
        .getElementById("nameInput")
        .value =
        contact.name;


      document
        .getElementById("phoneInput")
        .value =
        contact.phone;


      document
        .getElementById("formArea")
        .classList.add("visible");

    }


    /* =====================================
       SAVE ADD / EDIT
    ====================================== */

    function saveContact() {

      const name =
        document
          .getElementById("nameInput")
          .value
          .trim();


      const phone =
        document
          .getElementById("phoneInput")
          .value
          .trim();


      if (!name) {

        alert(
          "Please enter the contact's name."
        );

        return;

      }


      if (!phone) {

        alert(
          "Please enter the contact's phone number."
        );

        return;

      }


      /* ADD NEW */

      if (editingId === null) {

        contacts.push({

          id: Date.now(),

          name: name,

          phone: phone

        });

      }


      /* EDIT EXISTING */

      else {

        const contact =
          contacts.find(function(item) {

            return item.id === editingId;

          });


        if (contact) {

          contact.name = name;

          contact.phone = phone;

        }

      }


      saveContacts();

      renderContacts();

      renderManageContacts();

      hideContactForm();

    }


    /* =====================================
       DELETE
    ====================================== */

    function deleteContact(id) {

      const contact =
        contacts.find(function(item) {

          return item.id === id;

        });


      if (!contact) return;


      const confirmed =
        confirm(
          "Are you sure you want to delete " +
          contact.name +
          "?"
        );


      if (!confirmed) return;


      contacts =
        contacts.filter(function(item) {

          return item.id !== id;

        });


      saveContacts();

      renderContacts();

      renderManageContacts();

    }


    /* =====================================
       HIDE CONTACT FORM
    ====================================== */

    function hideContactForm() {

      editingId = null;


      document
        .getElementById("formArea")
        .classList.remove("visible");

    }


    /* =====================================
       HELP
    ====================================== */

    function showHelp() {

      const message =
        document.getElementById(
          "helpMessage"
        );

      message.classList.toggle(
        "visible"
      );

    }


    /* =====================================
       PHONE LINK
    ====================================== */

    function phoneForLink(phone) {

      return phone.replace(
        /[^0-9+]/g,
        ""
      );

    }


    /* =====================================
       SAFE DISPLAY
    ====================================== */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    /* =====================================
       START APP
    ====================================== */

    saveContacts();

    renderContacts();


  </script>

</body>

</html>
