<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Just Call</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f8f5ff);
    color: #20252d;
}

.app {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    margin: auto;
    padding: 35px 20px 45px;
}

.header {
    text-align: center;
    margin-bottom: 28px;
}

h1 {
    margin: 0;
    font-size: 46px;
    letter-spacing: -1.5px;
}

.subtitle {
    margin-top: 7px;
    color: #69717d;
    font-size: 19px;
}


/* =========================
   BIG ACTION BUTTONS
========================= */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 15px;
}

.action {
    border: none;
    border-radius: 28px;
    min-height: 185px;
    color: white;
    cursor: pointer;
    box-shadow: 0 15px 35px rgba(0,0,0,.14);
    transition: .18s;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.action:hover {
    transform: translateY(-3px);
}

.action:active {
    transform: scale(.97);
}

.call-action {
    background: linear-gradient(145deg, #168b4b, #32ad68);
}

.text-action {
    background: linear-gradient(145deg, #5367df, #7585ef);
}

.help-action {
    width: 100%;
    min-height: 125px;
    margin-bottom: 28px;
    background: linear-gradient(145deg, #df4545, #f06b6b);
}

.action-icon {
    font-size: 58px;
    margin-bottom: 9px;
}

.help-action .action-icon {
    font-size: 50px;
}

.action-title {
    font-size: 30px;
    font-weight: 800;
}

.action-subtitle {
    font-size: 15px;
    opacity: .88;
    margin-top: 4px;
}


/* =========================
   VOICE PANEL
========================= */

.voice-panel {
    display: none;
    background: white;
    border-radius: 28px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 12px 35px rgba(48,63,90,.10);
    margin-bottom: 25px;
}

.voice-panel.show {
    display: block;
}

.voice-circle {
    width: 135px;
    height: 135px;
    border-radius: 50%;
    margin: auto;
    background: #20252d;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 55px;

    animation: pulse 1.3s infinite;
}

.voice-title {
    margin-top: 20px;
    font-size: 27px;
    font-weight: 750;
}

.voice-instruction {
    margin-top: 7px;
    color: #727a85;
    font-size: 18px;
}

.cancel {
    margin-top: 20px;
    border: none;
    padding: 12px 25px;
    border-radius: 12px;
    background: #eee;
    font-size: 16px;
    cursor: pointer;
}

@keyframes pulse {

    0% {
        box-shadow: 0 0 0 0 rgba(84,105,225,.35);
    }

    70% {
        box-shadow: 0 0 0 25px rgba(84,105,225,0);
    }

    100% {
        box-shadow: 0 0 0 0 rgba(84,105,225,0);
    }

}


/* =========================
   TEXT CONFIRMATION
========================= */

.confirm-panel {
    display: none;

    background: white;
    border-radius: 28px;

    padding: 28px 22px;

    box-shadow: 0 12px 35px rgba(48,63,90,.10);

    margin-bottom: 25px;

    text-align: center;
}

.confirm-panel.show {
    display: block;
}

.confirm-icon {
    font-size: 55px;
}

.confirm-title {
    font-size: 25px;
    font-weight: 750;
    margin-top: 8px;
}

.confirm-to {
    color: #707985;
    margin-top: 5px;
}

.message-box {
    margin-top: 20px;
    padding: 20px;
    border-radius: 18px;

    background: #f1f3ff;

    font-size: 21px;
    line-height: 1.4;

    text-align: left;
}

.confirm-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
}

.yes-button,
.no-button {
    border: none;
    border-radius: 15px;
    padding: 17px;

    font-size: 20px;
    font-weight: 700;

    cursor: pointer;
}

.yes-button {
    background: #24934d;
    color: white;
}

.no-button {
    background: #eee;
    color: #333;
}


/* =========================
   CONTACTS
========================= */

.section-title {
    font-size: 21px;
    font-weight: 750;
    margin: 25px 5px 12px;
}

.contacts {
    display: grid;
    gap: 12px;
}

.contact {
    width: 100%;

    border: none;
    border-radius: 22px;

    background: white;

    padding: 18px;

    display: flex;
    align-items: center;

    gap: 16px;

    text-align: left;

    cursor: pointer;

    box-shadow: 0 7px 25px rgba(48,63,90,.08);

    transition: .18s;
}

.contact:hover {
    transform: translateY(-2px);
}

.avatar {
    width: 64px;
    height: 64px;

    flex-shrink: 0;

    border-radius: 20px;

    background: #edf1f7;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
}

.contact-info {
    flex: 1;
}

.contact-name {
    font-size: 23px;
    font-weight: 700;
}

.relationship {
    color: #747d88;
    margin-top: 3px;
    font-size: 16px;
}

.contact-action {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: #e8f7ed;

    color: #24934d;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;
}


/* =========================
   CONTACT MANAGEMENT
========================= */

.setup {
    margin-top: 30px;

    background: white;

    border-radius: 22px;

    padding: 20px;

    box-shadow: 0 7px 25px rgba(48,63,90,.08);
}

summary {
    cursor: pointer;

    font-weight: 700;

    font-size: 18px;
}

.manage-title {
    margin-top: 22px;

    font-size: 20px;
    font-weight: 750;
}

.person-editor {
    background: #f6f7fa;

    border-radius: 18px;

    padding: 16px;

    margin-top: 12px;
}

.editor-row {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

label {
    display: block;

    margin-top: 12px;

    font-size: 14px;

    font-weight: 650;

    color: #5d6570;
}

input,
select {
    width: 100%;

    margin-top: 6px;

    padding: 13px;

    border: 1px solid #d9dde4;

    border-radius: 11px;

    font-size: 16px;

    background: white;
}

.editor-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 14px;
}

.save-person,
.delete-person {
    border: none;

    border-radius: 11px;

    padding: 12px;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;
}

.save-person {
    background: #20252d;
    color: white;
}

.delete-person {
    background: #f2dddd;
    color: #a32d2d;
}

.add-person {
    width: 100%;

    margin-top: 15px;

    border: none;

    border-radius: 13px;

    padding: 15px;

    background: #5367df;

    color: white;

    font-size: 17px;

    font-weight: 700;

    cursor: pointer;
}


/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translate(-50%, 120px);

    background: #20252d;

    color: white;

    padding: 16px 22px;

    border-radius: 15px;

    font-size: 17px;

    box-shadow: 0 12px 30px rgba(0,0,0,.25);

    transition: .3s;

    z-index: 20;

    max-width: 90%;

    text-align: center;
}

.toast.show {
    transform: translate(-50%, 0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:450px) {

    .app {
        padding: 27px 15px 35px;
    }

    h1 {
        font-size: 39px;
    }

    .actions {
        gap: 11px;
    }

    .action {
        min-height: 165px;
        border-radius: 24px;
    }

    .action-icon {
        font-size: 50px;
    }

    .action-title {
        font-size: 25px;
    }

    .help-action {
        min-height: 120px;
    }

    .editor-row {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>


<div class="app">


    <!-- HEADER -->

    <div class="header">

        <h1>
            Just Call
        </h1>

        <div class="subtitle">
            What would you like to do?
        </div>

    </div>



    <!-- BIG ACTIONS -->

    <div class="actions">


        <button
            class="action call-action"
            id="callButton"
        >

            <div class="action-icon">
                ☎️
            </div>

            <div class="action-title">
                CALL
            </div>

            <div class="action-subtitle">
                Tell me who to call
            </div>

        </button>



        <button
            class="action text-action"
            id="textButton"
        >

            <div class="action-icon">
                💬
            </div>

            <div class="action-title">
                TEXT
            </div>

            <div class="action-subtitle">
                Tell me what to say
            </div>

        </button>


    </div>



    <!-- HELP -->

    <button
        class="action help-action"
        id="helpButton"
    >

        <div class="action-icon">
            🆘
        </div>

        <div class="action-title">
            HELP
        </div>

        <div class="action-subtitle">
            Call my help contact
        </div>

    </button>



    <!-- VOICE -->

    <div
        class="voice-panel"
        id="voicePanel"
    >

        <div class="voice-circle">
            🎙️
        </div>

        <div
            class="voice-title"
            id="voiceTitle"
        >
            I'm listening
        </div>

        <div
            class="voice-instruction"
            id="voiceInstruction"
        >
        </div>

        <button
            class="cancel"
            id="cancelVoice"
        >
            Cancel
        </button>

    </div>



    <!-- TEXT CONFIRMATION -->

    <div
        class="confirm-panel"
        id="confirmPanel"
    >

        <div class="confirm-icon">
            💬
        </div>

        <div class="confirm-title">
            Ready to send
        </div>

        <div
            class="confirm-to"
            id="confirmTo"
        >
        </div>

        <div
            class="message-box"
            id="messageBox"
        >
        </div>

        <div class="confirm-buttons">

            <button
                class="yes-button"
                id="sendText"
            >
                ✓ SEND
            </button>

            <button
                class="no-button"
                id="cancelText"
            >
                ✕ CANCEL
            </button>

        </div>

    </div>



    <!-- CONTACT LIST -->

    <div class="section-title">
        People
    </div>

    <div
        class="contacts"
        id="contacts"
    >
    </div>



    <!-- EDITABLE PEOPLE -->

    <details class="setup">

        <summary>
            ⚙️ Manage people
        </summary>


        <div class="manage-title">
            Your people
        </div>


        <div id="peopleEditors">
        </div>


        <button
            class="add-person"
            id="addPerson"
        >
            + Add a person
        </button>

    </details>


</div>



<div
    class="toast"
    id="toast"
>
</div>



<script>


/* =========================
   DATA
========================= */

let people =
    JSON.parse(
        localStorage.getItem(
            "justCallPeople"
        )
    ) || [

        {
            id: crypto.randomUUID(),
            name: "Sarah",
            relationship: "Granddaughter",
            phone: "",
            icon: "👧",
            help: false
        },

        {
            id: crypto.randomUUID(),
            name: "John",
            relationship: "Brother",
            phone: "",
            icon: "👨",
            help: false
        }

    ];



/* =========================
   ELEMENTS
========================= */

const contactsContainer =
    document.getElementById(
        "contacts"
    );

const peopleEditors =
    document.getElementById(
        "peopleEditors"
    );

const voicePanel =
    document.getElementById(
        "voicePanel"
    );

const voiceTitle =
    document.getElementById(
        "voiceTitle"
    );

const voiceInstruction =
    document.getElementById(
        "voiceInstruction"
    );

const confirmPanel =
    document.getElementById(
        "confirmPanel"
    );

const confirmTo =
    document.getElementById(
        "confirmTo"
    );

const messageBox =
    document.getElementById(
        "messageBox"
    );

const sendText =
    document.getElementById(
        "sendText"
    );

const toast =
    document.getElementById(
        "toast"
    );

let recognition = null;

let currentMode = null;



/* =========================
   SAVE DATA
========================= */

function savePeople() {

    localStorage.setItem(
        "justCallPeople",
        JSON.stringify(people)
    );

}



/* =========================
   RENDER CONTACTS
========================= */

function renderContacts() {

    contactsContainer.innerHTML = "";


    people.forEach(person => {

        if (!person.name) return;


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "contact";


        button.innerHTML = `

            <div class="avatar">
                ${person.icon || "👤"}
            </div>

            <div class="contact-info">

                <div class="contact-name">
                    ${escapeHTML(
                        person.name
                    )}
                </div>

                <div class="relationship">
                    ${escapeHTML(
                        person.relationship ||
                        "Contact"
                    )}
                </div>

            </div>

            <div class="contact-action">
                ☎
            </div>

        `;


        button.onclick = () => {

            callPerson(person);

        };


        contactsContainer.appendChild(
            button
        );

    });

}



/* =========================
   EDITORS
========================= */

function renderEditors() {

    peopleEditors.innerHTML = "";


    people.forEach(person => {

        const editor =
            document.createElement(
                "div"
            );


        editor.className =
            "person-editor";


        editor.innerHTML = `

            <div class="editor-row">

                <div>

                    <label>
                        Name

                        <input
                            class="person-name"
                            value="${escapeAttribute(
                                person.name
                            )}"
                        >

                    </label>

                </div>


                <div>

                    <label>
                        Relationship

                        <input
                            class="person-relationship"
                            value="${escapeAttribute(
                                person.relationship
                            )}"
                        >

                    </label>

                </div>

            </div>


            <label>
                Phone number

                <input
                    class="person-phone"
                    type="tel"
                    value="${escapeAttribute(
                        person.phone
                    )}"
                >

            </label>


            <label>
                Icon

                <select class="person-icon">

                    <option value="👤">👤 Person</option>
                    <option value="👩">👩 Woman</option>
                    <option value="👨">👨 Man</option>
                    <option value="👧">👧 Girl</option>
                    <option value="👦">👦 Boy</option>
                    <option value="❤️">❤️ Family</option>
                    <option value="🧑">🧑 Person</option>

                </select>

            </label>


            <label>

                <input
                    class="person-help"
                    type="checkbox"
                >

                Use this person for HELP

            </label>


            <div class="editor-buttons">

                <button
                    class="save-person"
                >
                    Save
                </button>

                <button
                    class="delete-person"
                >
                    Delete
                </button>

            </div>

        `;


        const iconSelect =
            editor.querySelector(
                ".person-icon"
            );

        iconSelect.value =
            person.icon || "👤";


        const helpCheckbox =
            editor.querySelector(
                ".person-help"
            );

        helpCheckbox.checked =
            person.help === true;


        editor
        .querySelector(
            ".save-person"
        )
        .onclick = () => {


            const newName =
                editor
                .querySelector(
                    ".person-name"
                )
                .value
                .trim();


            const newRelationship =
                editor
                .querySelector(
                    ".person-relationship"
                )
                .value
                .trim();


            const newPhone =
                editor
                .querySelector(
                    ".person-phone"
                )
                .value
                .trim();


            const newIcon =
                editor
                .querySelector(
                    ".person-icon"
                )
                .value;


            const isHelp =
                editor
                .querySelector(
                    ".person-help"
                )
                .checked;


            person.name =
                newName || "Unnamed";


            person.relationship =
                newRelationship ||
                "Contact";


            person.phone =
                newPhone;


            person.icon =
                newIcon;


            person.help =
                isHelp;


            /*
              Only one person can be
              the HELP contact.
            */

            if (isHelp) {

                people.forEach(other => {

                    if (
                        other.id !== person.id
                    ) {

                        other.help = false;

                    }

                });

            }


            savePeople();

            renderContacts();

            renderEditors();

            showToast(
                "Contact saved ❤️"
            );

        };


        editor
        .querySelector(
            ".delete-person"
        )
        .onclick = () => {

            const confirmed =
                confirm(
                    `Delete ${person.name}?`
                );


            if (!confirmed) return;


            people =
                people.filter(
                    other =>
                        other.id !==
                        person.id
                );


            savePeople();

            renderContacts();

            renderEditors();

            showToast(
                "Contact deleted."
            );

        };


        peopleEditors.appendChild(
            editor
        );

    });

}



/* =========================
   ADD PERSON
========================= */

document
.getElementById(
    "addPerson"
)
.onclick = () => {


    people.push({

        id: crypto.randomUUID(),

        name: "New Person",

        relationship: "Friend",

        phone: "",

        icon: "👤",

        help: false

    });


    savePeople();

    renderContacts();

    renderEditors();


    showToast(
        "New person added."
    );

};



/* =========================
   CALL PERSON
========================= */

function callPerson(person) {

    if (!person.phone) {

        showToast(
            `No phone number saved for ${person.name}.`
        );

        return;

    }


    window.location.href =
        "tel:" + person.phone;

}



/* =========================
   HELP
========================= */

document
.getElementById(
    "helpButton"
)
.onclick = () => {


    const helpPerson =
        people.find(
            person =>
                person.help === true
        );


    if (!helpPerson) {

        showToast(
            "Set a HELP contact in Manage People."
        );

        return;

    }


    if (!helpPerson.phone) {

        showToast(
            `No phone number saved for ${helpPerson.name}.`
        );

        return;

    }


    const confirmed =
        confirm(
            `Call ${helpPerson.name} for help?`
        );


    if (confirmed) {

        window.location.href =
            "tel:" +
            helpPerson.phone;

    }

};



/* =========================
   FIND PERSON
========================= */

function findPerson(text) {

    const lower =
        text.toLowerCase();


    /*
       First try names.
    */

    for (
        const person
        of people
    ) {

        if (
            person.name &&
            lower.includes(
                person.name.toLowerCase()
            )
        ) {

            return person;

        }

    }


    /*
       Then try relationships.

       This means:

       "Call my granddaughter"

       can still work.
    */

    for (
        const person
        of people
    ) {

        if (
            person.relationship &&
            lower.includes(
                person.relationship.toLowerCase()
            )
        ) {

            return person;

        }

    }


    return null;

}



/* =========================
   VOICE
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


function startListening(mode) {


    if (!SpeechRecognition) {

        showToast(
            "Voice recognition isn't supported in this browser."
        );

        return;

    }


    currentMode =
        mode;


    voicePanel.classList.add(
        "show"
    );


    confirmPanel.classList.remove(
        "show"
    );


    if (mode === "call") {

        voiceTitle.textContent =
            "Who would you like to call?";

        voiceInstruction.textContent =
            'Try "Call Sarah" or "Call my granddaughter."';

    }


    if (mode === "text") {

        voiceTitle.textContent =
            "Who would you like to text?";

        voiceInstruction.textContent =
            'Try "Text Sarah that I am home."';

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-CA";


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        3;


    recognition.onresult =
        event => {


            const spoken =
                event.results[0][0]
                .transcript
                .trim();


            voicePanel.classList.remove(
                "show"
            );


            if (
                currentMode ===
                "call"
            ) {

                processCall(
                    spoken
                );

            }


            if (
                currentMode ===
                "text"
            ) {

                processText(
                    spoken
                );

            }

        };


    recognition.onerror =
        () => {

            voicePanel.classList.remove(
                "show"
            );


            showToast(
                "I didn't catch that. Please try again."
            );

        };


    recognition.start();

}



/* =========================
   PROCESS CALL
========================= */

function processCall(
    spoken
) {


    const person =
        findPerson(
            spoken
        );


    if (!person) {

        showToast(
            "I don't know who you mean."
        );

        return;

    }


    callPerson(
        person
    );

}



/* =========================
   PROCESS TEXT
========================= */

function processText(
    spoken
) {


    const person =
        findPerson(
            spoken
        );


    if (!person) {

        showToast(
            "I don't know who you mean."
        );

        return;

    }


    if (!person.phone) {

        showToast(
            `No phone number saved for ${person.name}.`
        );

        return;

    }


    const message =
        extractMessage(
            spoken,
            person
        );


    if (!message) {

        showToast(
            "I couldn't hear the message."
        );

        return;

    }


    confirmTo.textContent =
        "To " + person.name;


    messageBox.textContent =
        message;


    sendText.dataset.phone =
        person.phone;


    sendText.dataset.message =
        message;


    confirmPanel.classList.add(
        "show"
    );

}



/* =========================
   EXTRACT MESSAGE
========================= */

function extractMessage(
    spoken,
    person
) {


    let message =
        spoken.trim();


    if (person.name) {

        message =
            message.replace(
                new RegExp(
                    person.name,
                    "i"
                ),
                ""
            );

    }


    if (person.relationship) {

        message =
            message.replace(
                new RegExp(
                    person.relationship,
                    "i"
                ),
                ""
            );

    }


    const prefixes = [

        /^text my /i,
        /^text the /i,
        /^text /i,

        /^message my /i,
        /^message the /i,
        /^message /i,

        /^send a text to my /i,
        /^send a text to /i

    ];


    for (
        const prefix
        of prefixes
    ) {

        message =
            message.replace(
                prefix,
                ""
            );

    }


    message =
        message
        .replace(
            /^(that|saying|say|to say)\s+/i,
            ""
        )
        .trim();


    return message;

}

function showToast(
    message
) {

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        3000
    );

}


function escapeHTML(
    text
) {

    return String(
        text || ""
    )
    .replace(
        /[&<>"']/g,
        character => {

            const replacements = {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            };

            return replacements[
                character
            ];

        }
    );

}


function escapeAttribute(
    text
) {

    return escapeHTML(
        text
    );

}
