<div

  <div class="settings-panel">

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://jjxycvkmikagnivxdxdd.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_gFuE_3Y3I6vs-Ib9Je4mkw_FXlD8wjX";


/* =====================================================
   STORAGE
===================================================== */

const CONTACT_STORAGE =
  "familyConnectContacts_v3";


let contacts = [];

let currentContact = null;

let currentConversation = null;

let realtimeChannel = null;


/* =====================================================
   LOAD CONTACTS
===================================================== */

try {

  const saved =
    localStorage.getItem(
      CONTACT_STORAGE
    );

  if (saved) {

    contacts =
      JSON.parse(saved);

  }

} catch {

  contacts = [];

}


/* =====================================================
   SAVE CONTACTS
===================================================== */

function saveContacts() {

  localStorage.setItem(
    CONTACT_STORAGE,
    JSON.stringify(contacts)
  );

}


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
  table,
  options = {}
) {

  const url =
    SUPABASE_URL +
    "/rest/v1/" +
    table;


  const response =
    await fetch(url, {

      method:
        options.method || "GET",

      headers: {

        "apikey":
          SUPABASE_KEY,

        "Authorization":
          "Bearer " +
          SUPABASE_KEY,

        "Content-Type":
          "application/json",

        "Prefer":
          options.prefer ||
          "return=representation"

      },

      body:
        options.body
          ? JSON.stringify(options.body)
          : undefined

    });


  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(error);

  }


  const text =
    await response.text();


  return text
    ? JSON.parse(text)
    : [];

}


/* =====================================================
   RENDER CONTACTS
===================================================== */

function renderContacts() {

  const list =
    document.getElementById(
      "contactList"
    );

  list.innerHTML = "";


  if (contacts.length === 0) {

    list.innerHTML = `

      <div class="empty-message">

        Your family can add contacts
        using the ⚙️ button.

      </div>

    `;

    return;
  }


  contacts.forEach(contact => {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "contact-card";


    card.innerHTML = `

      <h2 class="contact-name">

        ${escapeHTML(contact.name)}

      </h2>


      <div class="contact-actions">

        <a
          class="call-button"
          href="tel:${phoneNumber(contact.phone)}"
        >
          ☎️ Call
        </a>


        <button
          class="text-button"
          onclick="openThread('${contact.id}')"
        >
          💬 Text
        </button>

      </div>

    `;


    list.appendChild(card);

  });

}


/* =====================================================
   SETTINGS
===================================================== */

function openSettings() {

  renderManageList();

  document
    .getElementById(
      "settingsModal"
    )
    .classList.add("show");

}


function closeSettings() {

  cancelForm();

  document
    .getElementById(
      "settingsModal"
    )
    .classList.remove("show");

}


/* =====================================================
   MANAGE CONTACTS
===================================================== */

function renderManageList() {

  const list =
    document.getElementById(
      "manageList"
    );

  list.innerHTML = "";


  if (contacts.length === 0) {

    list.innerHTML = `

      <div class="empty-message">

        No contacts yet.

      </div>

    `;

    return;

  }


  contacts.forEach(contact => {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "manage-contact";


    row.innerHTML = `

      <div class="manage-info">

        <div class="manage-name">

          ${escapeHTML(contact.name)}

        </div>


        <div class="manage-phone">

          ${escapeHTML(contact.phone)}

        </div>

      </div>


      <button
        class="edit-button"
        onclick="editContact('${contact.id}')"
      >
        ✏️ Edit
      </button>


      <button
        class="delete-button"
        onclick="deleteContact('${contact.id}')"
      >
        🗑️ Delete
      </button>

    `;


    list.appendChild(row);

  });

}


/* =====================================================
   ADD
===================================================== */

function showAddForm() {

  editingId = null;


  document
    .getElementById("formTitle")
    .textContent =
    "Add Contact";


  document
    .getElementById("nameInput")
    .value = "";


  document
    .getElementById("phoneInput")
    .value = "";


  document
    .getElementById("contactForm")
    .classList.add("show");

}


/* =====================================================
   EDIT
===================================================== */

let editingId = null;


function editContact(id) {

  const contact =
    contacts.find(
      c => String(c.id) === String(id)
    );


  if (!contact) return;


  editingId = id;


  document
    .getElementById("formTitle")
    .textContent =
    "Edit Contact";


  document
    .getElementById("nameInput")
    .value =
    contact.name;


  document
    .getElementById("phoneInput")
    .value =
    contact.phone;


  document
    .getElementById("contactForm")
    .classList.add("show");

}


/* =====================================================
   SAVE
===================================================== */

function saveContact() {

  const name =
    document
      .getElementById(
        "nameInput"
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        "phoneInput"
      )
      .value
      .trim();


  if (!name || !phone) {

    alert(
      "Please enter a name and phone number."
    );

    return;

  }


  if (editingId === null) {

    contacts.push({

      id:
        crypto.randomUUID(),

      name,

      phone

    });

  }

  else {

    const contact =
      contacts.find(
        c =>
          String(c.id) ===
          String(editingId)
      );


    if (contact) {

      contact.name = name;

      contact.phone = phone;

    }

  }


  saveContacts();

  renderContacts();

  renderManageList();

  cancelForm();

}


/* =====================================================
   DELETE
===================================================== */

function deleteContact(id) {

  const contact =
    contacts.find(
      c =>
        String(c.id) ===
        String(id)
    );


  if (!contact) return;


  if (
    !confirm(
      "Delete " +
      contact.name +
      "?"
    )
  ) {

    return;

  }


  contacts =
    contacts.filter(
      c =>
        String(c.id) !==
        String(id)
    );


  saveContacts();

  renderContacts();

  renderManageList();

}


/* =====================================================
   CANCEL FORM
===================================================== */

function cancelForm() {

  editingId = null;


  document
    .getElementById(
      "contactForm"
    )
    .classList.remove("show");

}


/* =====================================================
   OPEN THREAD
===================================================== */

async function openThread(contactId) {

  const contact =
    contacts.find(
      c =>
        String(c.id) ===
        String(contactId)
    );


  if (!contact) return;


  currentContact =
    contact;


  document
    .getElementById(
      "threadName"
    )
    .textContent =
    contact.name;


  document
    .getElementById(
      "threadModal"
    )
    .classList.add("show");


  document
    .getElementById(
      "messages"
    )
    .innerHTML =
    "<div class='empty-message'>Loading...</div>";


  try {

    await getConversation();

    await loadMessages();

    subscribeToMessages();

  }

  catch (error) {

    console.error(error);

    document
      .getElementById(
        "messages"
      )
      .innerHTML = `

        <div class="empty-message">

          Couldn't load messages yet.

          <br><br>

          ${escapeHTML(error.message)}

        </div>

      `;

  }

}


/* =====================================================
   GET / CREATE CONVERSATION
===================================================== */

async function getConversation() {

  let result =
    await supabaseRequest(
      "conversations?contact_id=eq." +
      currentContact.supabase_id +
      "&select=*"
    );


  if (
    !result ||
    result.length === 0
  ) {

    result =
      await supabaseRequest(
        "conversations",
        {

          method: "POST",

          body: {

            contact_id:
              currentContact.supabase_id

          }

        }
      );

  }


  currentConversation =
    result[0];

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages() {

  const result =
    await supabaseRequest(

      "messages" +
      "?conversation_id=eq." +
      currentConversation.id +
      "&select=*" +
      "&order=created_at.asc"

    );


  renderMessages(result);

}


/* =====================================================
   DISPLAY MESSAGES
===================================================== */

function renderMessages(messages) {

  const container =
    document.getElementById(
      "messages"
    );


  container.innerHTML = "";


  if (!messages.length) {

    container.innerHTML = `

      <div class="empty-message">

        No messages yet.

        <br><br>

        Say hello! ❤️

      </div>

    `;

    return;

  }


  messages.forEach(message => {

    const bubble =
      document.createElement(
        "div"
      );


    bubble.className =
      "message " +
      (
        message.sender === "me"
          ? "me"
          : "contact"
      );


    const time =
      new Date(
        message.created_at
      ).toLocaleTimeString(
        [],
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );


    bubble.innerHTML = `

      <div>

        ${escapeHTML(message.message)}

      </div>


      <div class="message-time">

        ${time}

      </div>

    `;


    container.appendChild(
      bubble
    );

  });


  container.scrollTop =
    container.scrollHeight;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if (!text) return;


  if (!currentConversation) {

    alert(
      "The conversation isn't ready yet."
    );

    return;

  }


  input.value = "";


  try {

    await supabaseRequest(
      "messages",
      {

        method: "POST",

        body: {

          conversation_id:
            currentConversation.id,

          sender:
            "me",

          message:
            text

        }

      }
    );


    await loadMessages();

  }

  catch (error) {

    console.error(error);

    alert(
      "Message couldn't be saved."
    );

    input.value = text;

  }

}


/* =====================================================
   REALTIME
===================================================== */

function subscribeToMessages() {

  /*
    Supabase Realtime normally requires the
    JavaScript client library.

    For this first version we use polling below.
  */

  if (realtimeChannel) {

    clearInterval(
      realtimeChannel
    );

  }


  realtimeChannel =
    setInterval(
      async function() {

        if (
          currentConversation &&
          document
            .getElementById(
              "threadModal"
            )
            .classList
            .contains("show")
        ) {

          try {

            await loadMessages();

          }

          catch {

          }

        }

      },
      3000
    );

}


/* =====================================================
   CLOSE THREAD
===================================================== */

function closeThread() {

  if (realtimeChannel) {

    clearInterval(
      realtimeChannel
    );

    realtimeChannel =
      null;

  }


  currentConversation =
    null;

  currentContact =
    null;


  document
    .getElementById(
      "threadModal"
    )
    .classList
    .remove("show");

}
