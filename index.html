<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Family Connect</title>

  <style>

    /* =================================
       GENERAL
    ================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #fff7f8;
      color: #333333;
    }

    button,
    input {
      font-family: inherit;
    }

    a {
      -webkit-user-select: none;
      user-select: none;
    }


    /* =================================
       APP
    ================================= */

    .app {
      width: 100%;
      max-width: 600px;

      min-height: 100vh;

      margin: 0 auto;

      padding: 12px 16px 28px;

      background: #fff7f8;
    }


    /* =================================
       TOP BAR
    ================================= */

    .top-bar {
      height: 52px;

      display: flex;

      align-items: center;

      justify-content: flex-end;

      margin-bottom: 8px;
    }

    .settings-button {
      width: 48px;
      height: 48px;

      border: none;

      border-radius: 50%;

      background: white;

      color: #777;

      font-size: 25px;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.10);
    }

    .settings-button:active {
      transform: scale(0.92);
    }


    /* =================================
       CONTACT LIST
    ================================= */

    .contacts {
      display: flex;

      flex-direction: column;

      gap: 14px;
    }


    /* =================================
       CONTACT CARD
    ================================= */

    .contact-card {
      background: white;

      border-radius: 22px;

      padding: 18px;

      border: 1px solid #f3dfe3;

      box-shadow:
        0 4px 12px rgba(180, 100, 120, 0.08);
    }

    .contact-name {
      margin: 0 0 14px;

      text-align: center;

      font-size: 25px;

      font-weight: 750;

      color: #3f3f46;
    }


    /* =================================
       CALL / TEXT
    ================================= */

    .contact-actions {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;
    }

    .call-button,
    .text-button {
      min-height: 60px;

      border: none;

      border-radius: 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      text-decoration: none;

      font-size: 19px;

      font-weight: 750;

      cursor: pointer;
    }

    .call-button {
      background: #65c98a;

      color: white;

      box-shadow:
        0 3px 7px rgba(60,170,100,0.18);
    }

    .text-button {
      background: #79a9e8;

      color: white;

      box-shadow:
        0 3px 7px rgba(70,120,190,0.18);
    }

    .call-button:active,
    .text-button:active {
      transform: scale(0.97);
    }


    /* =================================
       HELP AREA
    ================================= */

    .help-area {
      margin-top: 22px;
    }

    .help-button {
      width: 100%;

      min-height: 88px;

      border: none;

      border-radius: 23px;

      background: #ef6b73;

      color: white;

      font-size: 31px;

      font-weight: 850;

      letter-spacing: 0.5px;

      cursor: pointer;

      box-shadow:
        0 5px 14px rgba(220,80,90,0.25);
    }

    .help-button:active {
      transform: scale(0.97);
    }


    /* =================================
       HELP MESSAGE
    ================================= */

    .help-message {
      display: none;

      margin-top: 12px;

      padding: 18px;

      background: white;

      border-radius: 18px;

      text-align: center;

      font-size: 17px;

      line-height: 1.5;

      border: 1px solid #f3dfe3;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.07);
    }

    .help-message.visible {
      display: block;
    }

    .help-message strong {
      color: #e0525c;
    }


    /* =================================
       SETTINGS OVERLAY
    ================================= */

    .settings-overlay {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 100;

      background: rgba(70,50,55,0.45);

      padding: 18px;

      align-items: center;

      justify-content: center;
    }

    .settings-overlay.visible {
      display: flex;
    }


    /* =================================
       SETTINGS PANEL
    ================================= */

    .settings-panel {
      width: 100%;

      max-width: 500px;

      max-height: 92vh;

      overflow-y: auto;

      background: #fffafa;

      border-radius: 25px;

      padding: 22px;

      box-shadow:
        0 12px 40px rgba(0,0,0,0.20);
    }

    .settings-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 18px;
    }

    .settings-title {
      margin: 0;

      font-size: 25px;

      color: #444;
    }

    .close-settings {
      width: 44px;
      height: 44px;

      border: none;

      border-radius: 50%;

      background: #f1e8ea;

      color: #555;

      font-size: 20px;

      cursor: pointer;
    }


    /* =================================
       FAMILY MESSAGE
    ================================= */

    .family-notice {
      padding: 15px;

      margin-bottom: 18px;

      border-radius: 15px;

      background: #fff0f3;

      color: #7d4a53;

      font-size: 15px;

      line-height: 1.45;
    }


    /* =================================
       ADD CONTACT
    ================================= */

    .add-button {
      width: 100%;

      min-height: 55px;

      margin-bottom: 18px;

      border: none;

      border-radius: 15px;

      background: #8b78d8;

      color: white;

      font-size: 17px;

      font-weight: 750;

      cursor: pointer;
    }

    .add-button:active {
      transform: scale(0.98);
    }


    /* =================================
       MANAGE CONTACTS
    ================================= */

    .manage-contact {
      display: flex;

      align-items: center;

      gap: 9px;

      padding: 14px 0;

      border-top: 1px solid #eadfe2;
    }

    .manage-contact-info {
      flex: 1;

      min-width: 0;
    }

    .manage-name {
      font-size: 17px;

      font-weight: 700;

      color: #444;
    }

    .manage-phone {
      margin-top: 3px;

      font-size: 14px;

      color: #888;
    }

    .edit-button,
    .delete-button {
      min-height: 42px;

      padding: 8px 12px;

      border: none;

      border-radius: 11px;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;
    }

    .edit-button {
      background: #eeeaf9;

      color: #6657a3;
    }

    .delete-button {
      background: #fde4e6;

      color: #b64e57;
    }


    /* =================================
       FORM
    ================================= */

    .form-area {
      display: none;

      margin-top: 18px;

      padding-top: 18px;

      border-top: 1px solid #eadfe2;
    }

    .form-area.visible {
      display: block;
    }

    .form-title {
      margin: 0 0 16px;

      font-size: 21px;

      color: #444;
    }

    .form-label {
      display: block;

      margin: 13px 0 6px;

      font-size: 15px;

      font-weight: 700;
    }

    .form-input {
      width: 100%;

      min-height: 52px;

      padding: 0 14px;

      border: 1px solid #d9ced1;

      border-radius: 13px;

      background: white;

      font-size: 17px;

      outline: none;
    }

    .form-input:focus {
      border-color: #8b78d8;
    }

    .form-buttons {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 18px;
    }

    .save-button,
    .cancel-button {
      min-height: 52px;

      border: none;

      border-radius: 13px;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;
    }

    .save-button {
      background: #65c98a;

      color: white;
    }

    .cancel-button {
      background: #e9e4e5;

      color: #555;
    }


    /* =================================
       EMPTY
    ================================= */

    .empty-message {
      padding: 30px 15px;

      background: white;

      border-radius: 20px;

      text-align: center;

      color: #888;

      font-size: 17px;
    }


    /* =================================
       SMALL PHONES
    ================================= */

    @media (max-width: 380px) {

      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .contact-card {
        padding: 15px;
      }

      .contact-name {
        font-size: 23px;
      }

      .call-button,
      .text-button {
        font-size: 17px;
      }

      .help-button {
        font-size: 27px;
      }

      .manage-contact {
        flex-wrap: wrap;
      }

      .manage-contact-info {
        flex-basis: 100%;
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       MAIN DASHBOARD
  ====================================== -->

  <main class="app">


    <!-- FAMILY SETTINGS GEAR -->

    <div class="top-bar">

      <button
        class="settings-button"
        type="button"
        onclick="openSettings()"
        aria-label="Family settings"
      >
        ⚙️
      </button>

    </div>


    <!-- CONTACTS -->

    <section
      class="contacts"
      id="contactList"
    >
    </section>


    <!-- HELP -->

    <div class="help-area">

      <button
        class="help-button"
        type="button"
        onclick="showHelp()"
      >
        🆘 HELP
      </button>


      <div
        class="help-message"
        id="helpMessage"
      >

        <strong>We're here to help. ❤️</strong>

        <br><br>

        Choose a person above to call or text.

      </div>

    </div>


  </main>


  <!-- =====================================
       FAMILY SETTINGS
  ====================================== -->

  <div
    class="settings-overlay"
    id="settingsOverlay"
  >

    <div class="settings-panel">


      <div class="settings-header">

        <h2 class="settings-title">
          ⚙️ Family Settings
        </h2>

        <button
          class="close-settings"
          type="button"
          onclick="closeSettings()"
        >
          ✕
        </button>

      </div>


      <div class="family-notice">

        ❤️ This area is for family members or
        caregivers. Contacts added here will appear
        on the main screen.

      </div>


      <button
        class="add-button"
        type="button"
        onclick="showContactForm()"
      >
        ＋ Add Contact
      </button>


      <div id="manageContactList">
      </div>


      <!-- CONTACT FORM -->

      <div
        class="form-area"
        id="formArea"
      >

        <h3
          class="form-title"
          id="formTitle"
        >
          Add Contact
        </h3>


        <label
          class="form-label"
          for="nameInput"
        >
          Name
        </label>

        <input
          class="form-input"
          id="nameInput"
          type="text"
          placeholder="For example: Susan"
          autocomplete="name"
        >


        <label
          class="form-label"
          for="phoneInput"
        >
          Phone Number
        </label>

        <input
          class="form-input"
          id="phoneInput"
          type="tel"
          placeholder="902-555-1234"
          autocomplete="tel"
        >


        <div class="form-buttons">

          <button
            class="cancel-button"
            type="button"
            onclick="hideContactForm()"
          >
            Cancel
          </button>

          <button
            class="save-button"
            type="button"
            onclick="saveContact()"
          >
            Save ❤️
          </button>

        </div>

      </div>


    </div>

  </div>


  <script>


    /* =====================================
       CONTACTS
    ====================================== */

    let contacts =
      JSON.parse(
        localStorage.getItem("familyConnectContacts")
      ) || [

        {
          id: 1,
          name: "Brian",
          phone: "902-555-0101"
        },

        {
          id: 2,
          name: "Lisa",
          phone: "902-555-0102"
        },

        {
          id: 3,
          name: "Mom",
          phone: "902-555-0103"
        }

      ];


    let editingId = null;


    /* =====================================
       SAVE
    ====================================== */

    function saveContacts() {

      localStorage.setItem(
        "familyConnectContacts",
        JSON.stringify(contacts)
      );

    }


    /* =====================================
       SHOW CONTACTS
    ====================================== */

    function renderContacts() {

      const list =
        document.getElementById(
          "contactList"
        );

      list.innerHTML = "";


      if (contacts.length === 0) {

        list.innerHTML = `
          <div class="empty-message">
            ❤️ No contacts yet.
          </div>
        `;

        return;
      }


      contacts.forEach(function(contact) {

        const card =
          document.createElement("article");

        card.className =
          "contact-card";


        card.innerHTML = `

          <h2 class="contact-name">
            ${escapeHtml(contact.name)}
          </h2>


          <div class="contact-actions">

            <a
              class="call-button"
              href="tel:${phoneForLink(contact.phone)}"
              aria-label="Call ${escapeHtml(contact.name)}"
            >
              ☎️ Call
            </a>


            <a
              class="text-button"
              href="sms:${phoneForLink(contact.phone)}"
              aria-label="Text ${escapeHtml(contact.name)}"
            >
              💬 Text
            </a>

          </div>

        `;


        list.appendChild(card);

      });

    }


    /* =====================================
       OPEN SETTINGS
    ====================================== */

    function openSettings() {

      renderManageContacts();

      document
        .getElementById("settingsOverlay")
        .classList.add("visible");

    }


    /* =====================================
       CLOSE SETTINGS
    ====================================== */

    function closeSettings() {

      hideContactForm();

      document
        .getElementById("settingsOverlay")
        .classList.remove("visible");

    }


    /* =====================================
       SHOW FAMILY CONTACTS
    ====================================== */

    function renderManageContacts() {

      const list =
        document.getElementById(
          "manageContactList"
        );

      list.innerHTML = "";


      contacts.forEach(function(contact) {

        const row =
          document.createElement("div");

        row.className =
          "manage-contact";


        row.innerHTML = `

          <div class="manage-contact-info">

            <div class="manage-name">
              ${escapeHtml(contact.name)}
            </div>

            <div class="manage-phone">
              ${escapeHtml(contact.phone)}
            </div>

          </div>


          <button
            class="edit-button"
            type="button"
            onclick="editContact(${contact.id})"
          >
            ✏️ Edit
          </button>


          <button
            class="delete-button"
            type="button"
            onclick="deleteContact(${contact.id})"
          >
            🗑️ Delete
          </button>

        `;


        list.appendChild(row);

      });

    }


    /* =====================================
       ADD CONTACT
    ====================================== */

    function showContactForm() {

      editingId = null;


      document
        .getElementById("formTitle")
        .textContent =
        "Add Contact";


      document
        .getElementById("nameInput")
        .value = "";


      document
        .getElementById("phoneInput")
        .value = "";


      document
        .getElementById("formArea")
        .classList.add("visible");


      setTimeout(function() {

        document
          .getElementById("nameInput")
          .focus();

      }, 100);

    }


    /* =====================================
       EDIT CONTACT
    ====================================== */

    function editContact(id) {

      const contact =
        contacts.find(function(item) {

          return item.id === id;

        });


      if (!contact) return;


      editingId = id;


      document
        .getElementById("formTitle")
        .textContent =
        "Edit Contact";


      document
        .getElementById("nameInput")
        .value =
        contact.name;


      document
        .getElementById("phoneInput")
        .value =
        contact.phone;


      document
        .getElementById("formArea")
        .classList.add("visible");

    }


    /* =====================================
       SAVE CONTACT
    ====================================== */

    function saveContact() {

      const name =
        document
          .getElementById("nameInput")
          .value
          .trim();


      const phone =
        document
          .getElementById("phoneInput")
          .value
          .trim();


      if (!name) {

        alert(
          "Please enter a name."
        );

        return;

      }


      if (!phone) {

        alert(
          "Please enter a phone number."
        );

        return;

      }


      if (editingId === null) {

        contacts.push({

          id: Date.now(),

          name: name,

          phone: phone

        });

      }

      else {

        const contact =
          contacts.find(function(item) {

            return item.id === editingId;

          });


        if (contact) {

          contact.name = name;

          contact.phone = phone;

        }

      }


      saveContacts();

      renderContacts();

      renderManageContacts();

      hideContactForm();

    }


    /* =====================================
       DELETE CONTACT
    ====================================== */

    function deleteContact(id) {

      const contact =
        contacts.find(function(item) {

          return item.id === id;

        });


      if (!contact) return;


      const confirmed =
        confirm(
          "Delete " +
          contact.name +
          " from the contacts?"
        );


      if (!confirmed) return;


      contacts =
        contacts.filter(function(item) {

          return item.id !== id;

        });


      saveContacts();

      renderContacts();

      renderManageContacts();

    }


    /* =====================================
       HIDE FORM
    ====================================== */

    function hideContactForm() {

      editingId = null;

      document
        .getElementById("formArea")
        .classList.remove("visible");

    }


    /* =====================================
       HELP
    ====================================== */

    function showHelp() {

      const message =
        document.getElementById(
          "helpMessage"
        );

      message.classList.toggle(
        "visible"
      );

    }


    /* =====================================
       PHONE NUMBER
    ====================================== */

    function phoneForLink(phone) {

      return phone.replace(
        /[^0-9+]/g,
        ""
      );

    }


    /* =====================================
       SAFE TEXT
    ====================================== */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    /* =====================================
       START
    ====================================== */

    saveContacts();

    renderContacts();

  </script>

</body>

</html>
